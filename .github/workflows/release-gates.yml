name: release gates

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: test scope for this release
        required: true
        default: full
        type: choice
        options:
          - full
          - focused
  push:
    branches:
      - main
    paths:
      - src/**
      - database/**
      - pp/**
      - deploy/Dockerfile.build
      - deploy/certbot/**
      - deploy/stunnel/**
      - deploy/systemd/**
      - tools/activate-release.sh
      - tools/backup-postgres.sh
      - tools/backup-postgres-object.sh
      - tools/restore-postgres-drill.sh
      - build.zig
      - build.zig.zon
      - changelog_module.zig
      - .github/workflows/release-gates.yml

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    name: pinned linux x64 release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: zigcho
          POSTGRES_USER: zigcho
          POSTGRES_PASSWORD: zigcho-gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zigcho -d zigcho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: check out zigcho
        uses: actions/checkout@v6

      - name: verify the dynamic changelog feed
        run: python3 tools/changelog-manifest.py --check

      - name: build with the pinned production container
        run: docker build --file deploy/Dockerfile.build --tag zigcho-release-gate:${GITHUB_SHA} .

      - name: extract and verify the release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/server
          container=$(docker create "zigcho-release-gate:${GITHUB_SHA}")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/out/." artifacts/server
          test -x artifacts/server/zigcho
          test -x artifacts/server/zigcho-import
          test -x artifacts/server/zigcho-import-archive
          test -x artifacts/server/zigcho-migrate-postgres
          test -s artifacts/server/pp-engine-version
          binary_type=$(file -b artifacts/server/zigcho)
          printf '%s\n' "$binary_type"
          [[ "$binary_type" == *'ELF 64-bit LSB'* ]]
          [[ "$binary_type" == *'x86-64'* ]]
          [[ "$binary_type" != *'not stripped'* ]]
          if test -n "$(find artifacts/server -type f -name '*.pdb' -print -quit)"; then
            exit 1
          fi
          activate=artifacts/server/tools/activate-release.sh
          stop_line=$(grep -n '^systemctl stop "$service"$' "$activate" | cut -d: -f1)
          stopped_line=$(grep -n '^service_stopped=yes$' "$activate" | tail -n 1 | cut -d: -f1)
          check_line=$(grep -n '^runuser --user zigcho -- env ZIGCHO_POSTGRES_URL=.*"$candidate/zigcho" check$' "$activate" | cut -d: -f1)
          test "$stop_line" -lt "$stopped_line"
          test "$stopped_line" -lt "$check_line"

      - name: run PostgreSQL integration tests
        if: github.event_name != 'workflow_dispatch' || inputs.test_scope == 'full'
        shell: bash
        env:
          PGPASSWORD: zigcho-gate
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U zigcho zigcho_pool
          createdb -h 127.0.0.1 -U zigcho zigcho_store
          createdb -h 127.0.0.1 -U zigcho zigcho_migrate
          createdb -h 127.0.0.1 -U zigcho zigcho_bss
          createdb -h 127.0.0.1 -U zigcho zigcho_room_chat
          createdb -h 127.0.0.1 -U zigcho zigcho_ranked
          createdb -h 127.0.0.1 -U zigcho zigcho_history
          docker run --rm --network host \
            -e 'ZIGCHO_TEST_POSTGRES_URL=host=127.0.0.1 port=5432 dbname=zigcho_pool user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_STORE_URL=host=127.0.0.1 port=5432 dbname=zigcho_store user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_MIGRATE_URL=host=127.0.0.1 port=5432 dbname=zigcho_migrate user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_BSS_URL=host=127.0.0.1 port=5432 dbname=zigcho_bss user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_ROOM_CHAT_URL=host=127.0.0.1 port=5432 dbname=zigcho_room_chat user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_RANKED_URL=host=127.0.0.1 port=5432 dbname=zigcho_ranked user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_HISTORY_URL=host=127.0.0.1 port=5432 dbname=zigcho_history user=zigcho password=zigcho-gate connect_timeout=5' \
            "zigcho-release-gate:${GITHUB_SHA}" \
            zig build test -Doptimize=ReleaseSafe

      - name: run focused correction tests
        if: github.event_name == 'workflow_dispatch' && inputs.test_scope == 'focused'
        shell: bash
        env:
          PGPASSWORD: zigcho-gate
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U zigcho zigcho_migrate
          docker run --rm --network host \
            -e 'ZIGCHO_TEST_POSTGRES_MIGRATE_URL=host=127.0.0.1 port=5432 dbname=zigcho_migrate user=zigcho password=zigcho-gate connect_timeout=5' \
            "zigcho-release-gate:${GITHUB_SHA}" \
            sh -lc '
              set -eu
              for filter in \
                "official lazer score bodies" \
                "lazer solo score tokens" \
                "stable and lazer share one ranked performance result per map" \
                "lazer profile JSON owns" \
                "website profile plays keep" \
                "schema forty four"
              do
                zig build test -Doptimize=ReleaseSafe "-Dtest-filter=$filter"
              done
            '

      - name: boot the exact binary on PostgreSQL
        shell: bash
        env:
          ZIGCHO_POSTGRES_URL: host=127.0.0.1 port=5432 dbname=zigcho user=zigcho password=zigcho-gate connect_timeout=5
          PGPASSWORD: zigcho-gate
        run: |
          set -euo pipefail
          artifacts/server/zigcho check
          test "$(psql -h 127.0.0.1 -U zigcho -d zigcho -Atc 'select max(version) from zigcho.schema_migrations')" = 44
          test "$(psql -h 127.0.0.1 -U zigcho -d zigcho -Atc 'select min(next_id) >= 1000000000 from zigcho.bss_counters')" = t
          artifacts/server/zigcho 127.0.0.1 18099 >artifacts/server-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; wait "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=no
          for attempt in $(seq 1 30); do
            health=$(curl --fail --silent --show-error http://127.0.0.1:18099/health || true)
            if [[ "$health" == *'"ok":true'* ]]; then
              ready=yes
              break
            fi
            sleep 1
          done
          test "$ready" = yes
          bot=$(curl --fail --silent --show-error -H 'Host: kai.ovh' 'http://127.0.0.1:18099/api/v1/users/kai?source=all&mode=0')
          [[ "$bot" == *'"is_bot":true'* ]]
          multiplayer_page=$(curl --fail --silent --show-error -H 'Host: kai.ovh' 'http://127.0.0.1:18099/multiplayer')
          [[ "$multiplayer_page" == *'<title>kai</title>'* ]]
          chat_page=$(curl --fail --silent --show-error -H 'Host: kai.ovh' 'http://127.0.0.1:18099/chat')
          [[ "$chat_page" == *'<title>kai</title>'* ]]
          realtime_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'Host: spectator.kai.ovh' 'http://127.0.0.1:18099/multiplayer')
          test "$realtime_status" = 401
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT
          (cd artifacts/server && sha256sum zigcho > zigcho.sha256 && sha256sum --check zigcho.sha256)

      - name: upload the deployable release
        uses: actions/upload-artifact@v7
        with:
          name: zigcho-linux-x64-${{ github.sha }}
          path: artifacts/server
          if-no-files-found: error
          retention-days: 30
