<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#09090a">
  <title>kai</title>
  <style>
    :root{--bg:#09090a;--surface:#111113;--text:#ece8e6;--muted:#928b89;--line:#292427;--pink:#ed83b6;--pink-soft:#4a2939;--good:#8fd4b1;--bad:#f07d87;--bad-soft:#3b1d23}
    *{box-sizing:border-box}html{background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}body{margin:0;min-height:100svh}a{color:inherit;text-decoration:none}button{font:inherit}
    .shell{width:min(980px,calc(100% - 32px));margin:auto;min-height:100svh;display:flex;flex-direction:column}
    header{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{font:650 22px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.04em}.brand i{font-style:normal;color:var(--pink)}nav{display:flex;gap:24px;color:var(--muted);font-size:12px}nav a:hover,nav a.active{color:var(--text)}
    main{flex:1;padding:64px 0 72px}.eyebrow{color:var(--pink);font-size:10px;text-transform:uppercase;letter-spacing:.14em}.intro{display:flex;justify-content:space-between;align-items:end;gap:40px;padding-bottom:34px;border-bottom:1px solid var(--line)}
    h1{font:620 clamp(34px,6vw,64px)/.98 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.055em;margin:10px 0 0;max-width:680px}h2{font:600 22px/1.15 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.035em;margin:0}p{color:var(--muted)}
    .live{display:flex;align-items:center;gap:7px;color:var(--good);font-size:11px;white-space:nowrap}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}.stat{padding:21px 0}.stat+.stat{border-left:1px solid var(--line);padding-left:22px}.label{color:var(--muted);font-size:10px}.value{margin-top:6px;font-size:20px}
    .section{padding:42px 0;border-bottom:1px solid var(--line)}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}.text-link{color:var(--pink);font-size:11px}
    .rows{border-top:1px solid var(--line)}.row{min-height:58px;display:grid;grid-template-columns:52px minmax(180px,1fr) repeat(3,minmax(85px,auto));align-items:center;gap:18px;border-bottom:1px solid var(--line);transition:background .15s ease,padding .15s ease}.row:hover{background:var(--surface);padding:0 10px}.rank{color:var(--muted)}.player{display:flex;align-items:center;gap:12px;min-width:0}.avatar{width:32px;height:32px;object-fit:cover;border-radius:4px;background:var(--surface)}.name{display:block;font:560 14px ui-sans-serif,system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.country{display:flex;align-items:center;gap:6px}.country-flag{font:14px/1 "Apple Color Emoji","Segoe UI Emoji",sans-serif}.country,.metric small{color:var(--muted);font-size:10px}.metric{text-align:right}.metric strong{display:block;font-weight:500}
    .mode-filters{display:grid;gap:9px;min-width:275px}.filter-line{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}.filter-label{width:58px;color:var(--muted);font-size:9px;text-align:right;text-transform:uppercase;letter-spacing:.1em}.filter{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 10px;cursor:pointer}.filter:hover,.filter.active{border-color:var(--pink-soft);background:var(--pink-soft);color:var(--text)}.mode-bar{display:flex;justify-content:flex-end;padding:18px 0;border-bottom:1px solid var(--line)}
    .profile-head{display:grid;grid-template-columns:112px 1fr;gap:28px;align-items:end;padding-bottom:30px;border-bottom:1px solid var(--line)}.profile-avatar{width:112px;height:112px;object-fit:cover;border-radius:7px}.profile-name{font:620 clamp(36px,7vw,68px)/.9 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.06em}.meta{margin-top:12px;color:var(--muted);font-size:11px}.role{color:var(--pink)}
    .profile-stats{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}.profile-stats .stat{min-width:0}.profile-stats .stat+.stat{border-left:1px solid var(--line);padding-left:16px}.profile-stats .value{font-size:17px;overflow:hidden;text-overflow:ellipsis}
    .score{display:grid;grid-template-columns:minmax(220px,1fr) repeat(4,minmax(70px,auto));gap:18px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);transition:background .15s ease,padding .15s ease}.score:hover{background:var(--surface);padding-left:10px;padding-right:10px}.score.pinned-score{border-left:2px solid var(--pink);padding-left:12px}.score.pinned-score:hover{padding-left:18px}.score.failed-score{border-left:2px solid var(--bad);padding-left:12px;background:linear-gradient(90deg,var(--bad-soft),transparent 34%)}.score.failed-score:hover{padding-left:18px}.score-kicker{display:block;color:var(--pink);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}.map-line{display:flex;align-items:center;gap:9px;min-width:0}.map-title{font:550 13px ui-sans-serif,system-ui,sans-serif}.result-failed{flex:none;color:var(--bad);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.diff{display:block;color:var(--muted);font-size:11px;margin-top:4px}.mods{color:var(--pink);margin-left:7px}
    .map-head{padding-bottom:28px;border-bottom:1px solid var(--line)}.map-title-big{font:620 clamp(34px,6vw,60px)/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.05em;margin:8px 0}.map-artist{color:var(--muted);font-size:16px}.map-meta{margin-top:18px;color:var(--muted)}.download{display:inline-block;margin-top:20px;padding:9px 13px;background:var(--pink);color:#180d13;font-weight:700}
    .difficulty{display:grid;grid-template-columns:minmax(180px,1fr) repeat(5,minmax(60px,auto));gap:18px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}.status{color:var(--pink)}
    .staff-auth{width:min(520px,100%);padding-top:34px}.field{display:grid;gap:7px;margin-bottom:18px}.field span{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}.field input,.field select,.field textarea,.inline-form input,.inline-form select{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:12px 13px;outline:0}.field textarea{min-height:140px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus,.inline-form input:focus,.inline-form select:focus{border-color:var(--pink)}.action{border:0;background:var(--pink);color:#180d13;padding:10px 14px;font-weight:700;cursor:pointer}.action:disabled{opacity:.55;cursor:wait}.quiet-action{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 11px;cursor:pointer}.quiet-action:hover{color:var(--text);border-color:var(--pink-soft)}.danger{color:var(--bad);border-color:var(--bad-soft)}.form-error{min-height:20px;margin:12px 0 0;color:var(--bad);font-size:11px}.form-good{min-height:20px;margin:12px 0 0;color:var(--good);font-size:11px}.session-line{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 0;border-bottom:1px solid var(--line)}.session-user{display:flex;align-items:center;gap:9px}.security-list{border-top:1px solid var(--line)}.security-row{display:grid;grid-template-columns:170px 1fr;gap:22px;padding:15px 0;border-bottom:1px solid var(--line)}.security-row span:first-child{color:var(--text)}.security-row span:last-child{color:var(--muted)}.staff-tabs{display:flex;gap:18px;overflow:auto;padding:18px 0;border-bottom:1px solid var(--line)}.staff-tab{flex:none;border:0;background:transparent;color:var(--muted);padding:0;cursor:pointer}.staff-tab.active,.staff-tab:hover{color:var(--pink)}.staff-panel{padding-top:34px}.staff-summary{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.staff-summary .stat{border-bottom:1px solid var(--line)}.staff-summary .stat:nth-child(3n+2),.staff-summary .stat:nth-child(3n+3){border-left:1px solid var(--line);padding-left:20px}.staff-list{border-top:1px solid var(--line)}.staff-row{display:grid;grid-template-columns:minmax(160px,1fr) minmax(150px,2fr) auto;gap:20px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}.staff-row small{display:block;color:var(--muted);margin-top:4px}.staff-row .row-actions{display:flex;gap:8px;align-items:center}.inline-form{display:grid;grid-template-columns:120px minmax(180px,1fr) auto;gap:10px;padding:20px 0;border-bottom:1px solid var(--line)}.staff-message{color:var(--muted);white-space:pre-wrap}.staff-badge{color:var(--pink);font-size:10px;text-transform:uppercase;letter-spacing:.1em}.staff-badge.bad{color:var(--bad)}
    .water{position:relative;height:70px;margin-top:34px;overflow:hidden;border-bottom:1px dashed var(--line)}.boat-run{position:absolute;left:-58px;bottom:8px;width:50px;height:38px;animation:sail 18s linear infinite}.boat{position:relative;width:50px;height:38px;animation:bob 2.4s ease-in-out infinite}.mast{position:absolute;left:27px;top:1px;width:1px;height:22px;background:var(--muted)}.sail{position:absolute;left:12px;top:3px;width:14px;height:17px;border-right:1px solid var(--pink);border-bottom:1px solid var(--pink);transform:skewY(-24deg)}.hull{position:absolute;left:4px;top:25px;width:43px;height:8px;border-top:1px solid var(--text);border-radius:0 0 60% 50%}.wake{position:absolute;right:43px;top:33px;width:28px;border-top:1px dashed var(--pink);opacity:.55}
    .empty{padding:48px 0;color:var(--muted);border-bottom:1px solid var(--line)}.error{color:#e99090}footer{height:58px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px;border-top:1px solid var(--line)}
    .reveal{animation:reveal .28s ease both}@keyframes reveal{from{opacity:0;transform:translateY(8px)}}@keyframes sail{to{transform:translateX(1038px)}}@keyframes bob{50%{transform:translateY(-3px) rotate(1deg)}}
    .staff-feedback{grid-column:1/-1;min-height:18px;margin:0;color:var(--bad);font-size:11px}
    @media(max-width:760px){main{padding-top:38px}.intro{align-items:start;flex-direction:column;gap:18px}.mode-filters{min-width:0;width:100%}.filter-line{justify-content:flex-start}.filter-label{text-align:left}.mode-bar{justify-content:flex-start}.stats{grid-template-columns:repeat(2,1fr)}.stat+.stat{border-left:0;padding-left:0}.stat:nth-child(even){border-left:1px solid var(--line);padding-left:16px}.row{grid-template-columns:40px minmax(150px,1fr) auto}.row .metric:nth-last-child(-n+2){display:none}.profile-stats{grid-template-columns:repeat(2,1fr)}.score{grid-template-columns:1fr auto}.score .metric:not(:last-child){display:none}.difficulty{grid-template-columns:1fr repeat(2,auto)}.difficulty .metric:nth-last-child(n+4){display:none}.security-row{grid-template-columns:1fr;gap:4px}.staff-tabs{flex-wrap:wrap;overflow:visible;gap:12px 18px}.staff-summary{grid-template-columns:repeat(2,1fr)}.staff-summary .stat{border-left:0!important;padding-left:0!important}.staff-summary .stat:nth-child(even){border-left:1px solid var(--line)!important;padding-left:16px!important}.staff-row{grid-template-columns:1fr}.inline-form{grid-template-columns:1fr}.staff-row .row-actions{justify-content:flex-start}}
    @media(max-width:480px){nav{gap:14px}.profile-head{grid-template-columns:76px 1fr;gap:18px}.profile-avatar{width:76px;height:76px}.row{gap:10px}}
    @media(prefers-reduced-motion:reduce){.reveal,.boat-run,.boat{animation:none}.boat-run{left:45%}.row{transition:none}}
  </style>
</head>
<body>
  <div class="shell">
    <header><a class="brand" href="/">kai<i>.</i></a><nav><a href="/" data-nav="home">home</a><a href="/rankings" data-nav="rankings">rankings</a><a href="/appeal" data-nav="appeal">appeal</a><a href="/staff" data-nav="staff">staff</a></nav></header>
    <main id="app" aria-live="polite"><div class="empty">loading</div></main>
    <footer><span id="host">kai.ovh</span><span>debug alpha / bancho protocol 19</span></footer>
  </div>
  <script>
    const app=document.getElementById('app'),fmt=n=>Number(n||0).toLocaleString(),pct=n=>(Number(n||0)*100).toFixed(2)+'%';
    const modBits=[[1,'NF'],[2,'EZ'],[4,'TD'],[8,'HD'],[16,'HR'],[32,'SD'],[64,'DT'],[128,'RX'],[256,'HT'],[512,'NC'],[1024,'FL'],[2048,'AT'],[4096,'SO'],[8192,'AP'],[16384,'PF'],[32768,'4K'],[65536,'5K'],[131072,'6K'],[262144,'7K'],[524288,'8K'],[1048576,'FI'],[2097152,'RD'],[4194304,'CN'],[8388608,'TP'],[16777216,'9K'],[33554432,'CO'],[67108864,'1K'],[134217728,'3K'],[268435456,'2K'],[536870912,'V2'],[1073741824,'MR']];
    function mods(value){const bits=Number(value)||0,names=modBits.filter(([bit,name])=>(bits&bit)&&!(name==='DT'&&(bits&512))&&!(name==='SD'&&(bits&16384))).map(([,name])=>name);return '+'+(names.join('')||'NM')}
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const get=async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status===404?'not found':'not answering');return r.json()};
    const role=p=>p&(1<<14)?'developer':p&(1<<13)?'admin':p&(1<<12)?'moderator':p&(1<<11)?'beatmap nominator':p&(1<<4)?'supporter':'player';
    const statusName=s=>({0:'unknown',1:'unsubmitted',2:'pending',3:'ranked',4:'approved',5:'qualified',6:'loved',pending:'pending',ranked:'ranked',approved:'approved',qualified:'qualified',loved:'loved'})[s]||s||'unknown';
    const countryFlag=country=>/^[A-Z]{2}$/.test(country)&&country!=='XX'?String.fromCodePoint(...[...country].map(c=>127397+c.charCodeAt(0))):'🏳️';
    const flag=country=>`<span class="country-flag" role="img" aria-label="${esc(country)}" title="${esc(country)}">${countryFlag(country)}</span>`;
    const modeGroups=[{name:'vanilla',modes:[[0,'osu!'],[1,'taiko'],[2,'catch'],[3,'mania']]},{name:'relax',modes:[[4,'osu!'],[5,'taiko'],[6,'catch']]},{name:'autopilot',modes:[[8,'osu!']]}];
    let staffSession=null;
    const validModes=modeGroups.flatMap(g=>g.modes.map(m=>m[0])),cleanMode=value=>validModes.includes(Number(value))?Number(value):0;
    const modeInfo=mode=>{for(const group of modeGroups)for(const item of group.modes)if(item[0]===mode)return {namespace:group.name,ruleset:item[1],group};return {namespace:'vanilla',ruleset:'osu!',group:modeGroups[0]}};
    function modeFilters(mode){const info=modeInfo(mode);return `<div class="mode-filters"><div class="filter-line"><span class="filter-label">scoring</span>${modeGroups.map(g=>`<button type="button" class="filter ${g===info.group?'active':''}" aria-pressed="${g===info.group}" data-mode="${g.modes[0][0]}">${g.name}</button>`).join('')}</div><div class="filter-line"><span class="filter-label">ruleset</span>${info.group.modes.map(m=>`<button type="button" class="filter ${m[0]===mode?'active':''}" aria-pressed="${m[0]===mode}" data-mode="${m[0]}">${m[1]}</button>`).join('')}</div></div>`}
    function bindModeFilters(path){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>location.href=path+'?mode='+b.dataset.mode)}
    function active(name){document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===name))}
    function playerRows(players,limit=100,mode=0){if(!players.length)return '<div class="empty">nobody has a score here yet</div>';return '<div class="rows">'+players.slice(0,limit).map(p=>`<a class="row" href="/u/${p.id}?mode=${mode}"><span class="rank">#${fmt(p.rank)}</span><span class="player"><img class="avatar" src="https://a.kai.ovh/${p.id}" alt=""><span><span class="name">${esc(p.name)}</span><span class="country">${flag(p.country)}<span>${esc(role(p.privileges))}</span></span></span></span><span class="metric"><strong>${fmt(p.pp)}pp</strong><small>${pct(p.accuracy)}</small></span><span class="metric"><strong>${fmt(p.plays)}</strong><small>plays</small></span><span class="metric"><strong>${fmt(p.ranked_score)}</strong><small>ranked score</small></span></a>`).join('')+'</div>'}
    function scoreRows(scores,kind){if(!scores.length)return '';return '<div>'+scores.map((s,i)=>`<a class="score ${kind==='pinned'?'pinned-score ':''}${s.passed?'':'failed-score'}" href="/beatmapsets/${s.set_id}"><span><span class="score-kicker">${kind==='top'?'#'+(i+1)+' · weighted '+Number(s.weight.percentage).toFixed(2)+'%':kind==='pinned'?'pinned':'played '+new Date(s.submitted_at*1000).toLocaleDateString()}</span><span class="map-line"><span class="map-title">${esc(s.artist)} — ${esc(s.title)}</span>${s.passed?'':'<span class="result-failed">failed</span>'}</span><span class="diff">[${esc(s.version)}]<span class="mods">${mods(s.mods)}</span></span></span><span class="metric"><strong>${fmt(s.score)}</strong><small>score</small></span><span class="metric"><strong>${s.passed?Number(s.pp).toFixed(2)+'pp':'—'}</strong><small>${kind==='top'?Number(s.weight.pp).toFixed(2)+'pp weighted':s.passed?'performance':'no pp'}</small></span><span class="metric"><strong>${pct(s.accuracy)}</strong><small>accuracy</small></span><span class="metric"><strong>${fmt(s.max_combo)}x</strong><small>combo</small></span></a>`).join('')+'</div>'}
    async function home(){active('home');const [s,r]=await Promise.all([get('/api/v1/status'),get('/api/v1/rankings?mode=0')]);app.innerHTML=`<div class="reveal"><section class="intro"><div><span class="eyebrow">stable first</span><h1>the server is alive.<br>the rest is getting there.</h1></div><span class="live"><i class="dot"></i>live</span></section><section class="stats">${[['online',s.online],['accounts',s.users],['plays',s.plays],['passed',s.passed],['maps',s.maps]].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${fmt(x[1])}</div></div>`).join('')}</section><section class="section"><div class="section-head"><h2>top players</h2><a class="text-link" href="/rankings">all rankings →</a></div>${playerRows(r.players,5,0)}</section><div class="water" aria-label="a small boat moving across the page"><div class="boat-run" aria-hidden="true"><div class="boat"><i class="mast"></i><i class="sail"></i><i class="hull"></i><i class="wake"></i></div></div></div></div>`}
    async function rankings(){active('rankings');const params=new URLSearchParams(location.search),mode=cleanMode(params.get('mode')),info=modeInfo(mode),data=await get('/api/v1/rankings?mode='+mode);app.innerHTML=`<div class="reveal"><section class="intro"><div><span class="eyebrow">${info.namespace} / ${info.ruleset}</span><h1>rankings</h1></div>${modeFilters(mode)}</section><section class="section">${playerRows(data.players,100,mode)}</section></div>`;bindModeFilters('/rankings')}
    async function profile(id){active('');const params=new URLSearchParams(location.search),mode=cleanMode(params.get('mode')),info=modeInfo(mode),p=await get('/api/v1/users/'+id+'?mode='+mode),stats=p.stats.find(s=>s.mode===mode)||{};app.innerHTML=`<div class="reveal"><section class="profile-head"><img class="profile-avatar" src="https://a.kai.ovh/${p.id}" alt=""><div><div class="profile-name">${esc(p.name)}</div><div class="meta">${flag(p.country)} <span class="role">${esc(role(p.privileges))}</span> · joined ${new Date(p.created_at*1000).toLocaleDateString()}</div></div></section><section class="mode-bar">${modeFilters(mode)}</section><section class="profile-stats">${[['global rank','#'+fmt(stats.global_rank)],['performance',fmt(stats.pp)+'pp'],['accuracy',pct(stats.accuracy)],['playcount',fmt(stats.plays)],['ranked score',fmt(stats.ranked_score)],['max combo',fmt(stats.max_combo)+'x']].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</section><section class="section" id="pinned-plays"><div class="section-head"><h2>pinned plays</h2><span class="eyebrow">up to 3 · ${info.namespace} / ${info.ruleset}</span></div>${scoreRows(p.pinned_scores,'pinned')||'<div class="empty">nothing pinned here yet. /np a map in Stable, then use !pin.</div>'}</section><section class="section" id="top-plays"><div class="section-head"><h2>top plays</h2><span class="eyebrow">best performance · ${info.namespace} / ${info.ruleset}</span></div>${scoreRows(p.top_scores,'top')||'<div class="empty">no ranked top plays here yet</div>'}</section><section class="section" id="recent-plays"><div class="section-head"><h2>recent plays</h2><span class="eyebrow">last 20 · ${info.namespace} / ${info.ruleset}</span></div>${scoreRows(p.recent_scores,'recent')||'<div class="empty">no '+info.namespace+' '+info.ruleset+' plays yet</div>'}</section></div>`;bindModeFilters('/u/'+id)}
    async function beatmap(setId){active('');const b=await get('/api/v1/beatmapsets/'+setId);app.innerHTML=`<div class="reveal"><section class="map-head"><span class="eyebrow">${esc(statusName(b.status))}</span><h1 class="map-title-big">${esc(b.title)}</h1><div class="map-artist">${esc(b.artist)} · mapped by ${esc(b.creator)}</div><div class="map-meta">${fmt(b.play_count)} plays · ${Number(b.bpm).toFixed(0)} bpm · set ${fmt(b.id)}</div>${b.availability.download_disabled?'':'<a class="download" href="/d/'+b.id+'">download .osz</a>'}</section><section class="section"><div class="section-head"><h2>difficulties</h2><span class="eyebrow">${b.beatmaps.length} maps</span></div><div>${b.beatmaps.map(m=>`<div class="difficulty"><span><span class="map-title">${esc(m.version)}</span><span class="diff"><span class="status">${esc(statusName(m.status))}</span> · ${['osu!','taiko','catch','mania'][m.mode_int]||'mode '+m.mode_int}</span></span><span class="metric"><strong>${Number(m.difficulty_rating).toFixed(2)}★</strong><small>stars</small></span><span class="metric"><strong>${Number(m.bpm).toFixed(0)}</strong><small>bpm</small></span><span class="metric"><strong>${Number(m.cs).toFixed(1)}</strong><small>cs</small></span><span class="metric"><strong>${Number(m.ar).toFixed(1)}</strong><small>ar</small></span><span class="metric"><strong>${fmt(m.max_combo)}x</strong><small>combo</small></span></div>`).join('')}</div></section></div>`}
    const when=value=>value?new Date(Number(value)*1000).toLocaleString():'—';
    function appeal(){active('appeal');app.innerHTML=`<div class="reveal"><section class="intro"><div><span class="eyebrow">account review</span><h1>appeal a restriction.</h1><p>tell us what happened. one open appeal of each type is allowed at a time.</p></div></section><form class="staff-auth" id="appeal-form"><label class="field"><span>username</span><input name="username" autocomplete="username" maxlength="32" required autofocus></label><label class="field"><span>password</span><input name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></label><label class="field"><span>appeal type</span><select name="kind"><option value="restriction">account restriction</option><option value="hwid">hardware match / multiaccount</option></select></label><label class="field"><span>what should we review?</span><textarea name="message" minlength="20" maxlength="2000" required></textarea></label><button class="action" type="submit">send appeal</button><div class="form-error" role="alert"></div><div class="form-good" role="status"></div></form></div>`;document.getElementById('appeal-form').onsubmit=submitAppeal}
    async function submitAppeal(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button'),error=form.querySelector('.form-error'),good=form.querySelector('.form-good');button.disabled=true;error.textContent='';good.textContent='';try{const response=await fetch('/api/v1/appeals',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(form)),cache:'no-store'}),json=await response.json();form.elements.password.value='';if(!response.ok)throw new Error(json.error||'appeal failed');form.elements.message.value='';good.textContent=`appeal #${json.id} is in the review queue.`}catch(e){error.textContent=e.message}finally{button.disabled=false}}
    function staffLoginView(message=''){app.innerHTML=`<div class="reveal"><section class="intro"><div><span class="eyebrow">staff only</span><h1>sign in.</h1><p>use the same account you use on stable.</p></div></section><form class="staff-auth" id="staff-login"><label class="field"><span>username</span><input name="username" autocomplete="username" maxlength="32" required autofocus></label><label class="field"><span>password</span><input name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></label><button class="action" type="submit">sign in</button><div class="form-error" role="alert">${esc(message)}</div></form></div>`;document.getElementById('staff-login').onsubmit=staffLogin}
    const staffCan={rank:u=>!!(u.privileges&((1<<11)|(1<<13)|(1<<14))),moderate:u=>!!(u.privileges&((1<<12)|(1<<13)|(1<<14))),admin:u=>!!(u.privileges&((1<<13)|(1<<14))),develop:u=>!!(u.privileges&(1<<14))};
    function staffWorkspace(){const u=staffSession.user,tabs=[['overview','overview'],...(staffCan.rank(u)?[['ranking','bn queue']]:[]),...(staffCan.moderate(u)?[['moderation','moderation'],['appeals','appeals'],['audit','audit']]:[]),...(staffCan.admin(u)?[['channels','channels']]:[])];app.innerHTML=`<div class="reveal"><section class="intro"><div><span class="eyebrow">staff workspace</span><h1>${esc(u.name)}</h1><p>${esc(role(u.privileges))} access on the live server.</p></div>${flag(u.country)}</section><div class="session-line"><span class="session-user"><i class="dot"></i>signed in securely</span><button class="quiet-action" id="staff-logout" type="button">sign out</button></div><div class="staff-tabs">${tabs.map((t,i)=>`<button class="staff-tab ${i?'':'active'}" type="button" data-staff-tab="${t[0]}">${t[1]}</button>`).join('')}</div><div class="staff-panel" id="staff-panel"><div class="empty">loading</div></div></div>`;document.getElementById('staff-logout').onclick=staffLogout;document.querySelectorAll('[data-staff-tab]').forEach(button=>button.onclick=()=>staffSection(button.dataset.staffTab));staffSection('overview')}
    async function staffFetch(path,options={}){const headers={...(options.headers||{})};if(options.method&&options.method!=='GET')headers['x-csrf-token']=staffSession.csrf;const response=await fetch(path,{...options,headers,cache:'no-store'});let json={};try{json=await response.json()}catch{}if(response.status===401){staffSession=null;staffLoginView('your staff session ended');throw new Error('session ended')}if(!response.ok)throw new Error(json.error||'request failed');return json}
    async function staffPost(path,form){return staffFetch(path,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(form))})}
    async function staffSection(name){document.querySelectorAll('[data-staff-tab]').forEach(button=>button.classList.toggle('active',button.dataset.staffTab===name));const panel=document.getElementById('staff-panel');panel.innerHTML='<div class="empty">loading</div>';try{if(name==='overview')return staffOverview(panel);if(name==='ranking')return staffRanking(panel);if(name==='moderation')return staffModeration(panel);if(name==='appeals')return staffAppeals(panel);if(name==='audit')return staffAudit(panel);if(name==='channels')return staffChannels(panel)}catch(e){panel.innerHTML=`<div class="empty error">${esc(e.message)}</div>`}}
    function staffFormFailure(form,error){let message=form.querySelector('.staff-feedback');if(!message){message=document.createElement('p');message.className='staff-feedback';form.appendChild(message)}message.textContent=error.message||'that action failed'}
    async function staffOverview(panel){const d=await staffFetch('/api/v1/staff/overview');panel.innerHTML=`<div class="section-head"><h2>what needs attention</h2><span class="eyebrow">live data</span></div><div class="staff-summary">${[['open appeals',d.open_appeals],['ranking sets',d.ranking_sets],['restricted',d.restricted_users],['silenced',d.silenced_users],['audit / 24h',d.audit_24h],['hardware records',d.hardware_records]].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${fmt(x[1])}</div></div>`).join('')}</div><section class="section"><div class="section-head"><h2>session boundary</h2><span class="eyebrow">ready</span></div><div class="security-list"><div class="security-row"><span>browser storage</span><span>no auth token in JavaScript or local storage</span></div><div class="security-row"><span>cookie</span><span>host-only, secure, httpOnly, strict same-site</span></div><div class="security-row"><span>staff actions</span><span>same-origin and session-bound CSRF checks</span></div><div class="security-row"><span>expiry</span><span>eight hours, revocable immediately when access changes</span></div></div></section>`}
    async function staffRanking(panel){const d=await staffFetch('/api/v1/staff/ranking');panel.innerHTML=`<div class="section-head"><h2>bn queue</h2><span class="eyebrow">${d.queue.length} sets</span></div>${d.queue.length?`<div class="staff-list">${d.queue.map(q=>`<div class="staff-row"><span><strong>${esc(q.artist)} — ${esc(q.title)}</strong><small>set ${q.set_id} · mapped by ${esc(q.creator)}</small></span><span><span class="staff-badge">${esc(statusName(q.status))}</span><small>${q.requests} requests · ${q.nominations}/2 nominations · waiting since ${when(q.created_at)}</small></span><span class="row-actions"><button class="quiet-action" type="button" data-review-set="${q.set_id}">review</button></span></div>`).join('')}</div>`:'<div class="empty">the ranking queue is empty</div>'}<form class="inline-form" id="ranking-action"><input name="set_id" inputmode="numeric" placeholder="set id" required><select name="action"><option value="nominate">nominate</option><option value="qualify">qualify</option><option value="rank">rank</option><option value="love">love</option><option value="veto">veto</option>${staffCan.admin(staffSession.user)?'<option value="rollback">rollback</option>':''}</select><input name="reason" minlength="3" maxlength="1000" placeholder="reason" required><button class="action" type="submit">apply</button></form><section class="section"><div class="section-head"><h2>history</h2><span class="eyebrow">immutable</span></div><div class="staff-list">${d.history.map(e=>`<div class="staff-row"><span><strong>set ${e.set_id}</strong><small>${when(e.created_at)} · ${esc(e.actor)}</small></span><span><span class="staff-badge">${esc(e.action)}</span><small>${esc(statusName(e.from_status))} → ${esc(statusName(e.to_status))}</small></span><span class="staff-message">${esc(e.reason)}</span></div>`).join('')||'<div class="empty">no ranking history yet</div>'}</div></section>`;document.querySelectorAll('[data-review-set]').forEach(b=>b.onclick=()=>{panel.querySelector('[name=set_id]').value=b.dataset.reviewSet;panel.querySelector('[name=reason]').focus()});document.getElementById('ranking-action').onsubmit=async e=>{e.preventDefault();try{await staffPost('/api/v1/staff/ranking',e.currentTarget);staffRanking(panel)}catch(error){staffFormFailure(e.currentTarget,error)}}}
    async function staffModeration(panel){panel.innerHTML=`<div class="section-head"><h2>player review</h2><span class="eyebrow">exact name or id</span></div><form class="inline-form" id="player-search"><input name="user" placeholder="player" required><button class="action" type="submit">open</button></form><div id="player-review"></div>`;document.getElementById('player-search').onsubmit=async e=>{e.preventDefault();const target=document.getElementById('player-review');target.innerHTML='<div class="empty">loading</div>';try{const d=await staffFetch('/api/v1/staff/moderation?user='+encodeURIComponent(e.currentTarget.elements.user.value));renderPlayerReview(target,d)}catch(error){target.innerHTML=`<div class="empty error">${esc(error.message)}</div>`}}}
    function renderPlayerReview(target,d){const u=d.user;target.innerHTML=`<section class="section"><div class="section-head"><h2>${esc(u.name)}</h2><span>${flag(u.country)} <span class="staff-badge ${u.restricted?'bad':''}">${u.restricted?'restricted':esc(role(u.privileges))}</span></span></div><div class="security-list"><div class="security-row"><span>account</span><span>#${u.id} · joined ${when(u.created_at)} · last login ${when(u.last_login)}</span></div><div class="security-row"><span>silence</span><span>${u.silence_end>Date.now()/1000?'until '+when(u.silence_end):'not silenced'}</span></div><div class="security-row"><span>hardware</span><span>${u.exact_hardware_matches} other exact account match(es); ${d.hardware.length} stored signatures</span></div></div></section><form class="inline-form" id="moderation-action"><input type="hidden" name="user_id" value="${u.id}"><select name="action"><option value="note">add note</option><option value="silence">silence</option><option value="unsilence">unsilence</option>${staffCan.admin(staffSession.user)?'<option value="restrict">restrict</option><option value="unrestrict">unrestrict</option>':''}${staffCan.develop(staffSession.user)?'<option value="add_privilege">add privilege bits</option><option value="remove_privilege">remove privilege bits</option>':''}</select><input name="reason" minlength="3" maxlength="1000" placeholder="reason" required><input name="duration" inputmode="numeric" placeholder="seconds for silence"><input name="bits" inputmode="numeric" placeholder="privilege bits"><button class="action" type="submit">apply</button></form><section class="section"><div class="section-head"><h2>hardware evidence</h2><span class="eyebrow">hash tails only</span></div><div class="staff-list">${d.hardware.map(h=>`<div class="staff-row"><span><strong>${esc(h.client)}</strong><small>${h.wine?'wine · ':''}${h.occurrences} login(s)</small></span><span class="staff-message">adapter …${esc(h.adapter)} · uninstall …${esc(h.uninstall)} · disk …${esc(h.disk)}</span><span><small>${when(h.first_seen)} → ${when(h.last_seen)}</small></span></div>`).join('')||'<div class="empty">no hardware records</div>'}</div></section><section class="section"><div class="section-head"><h2>moderation history</h2><span class="eyebrow">${d.audit.length} events</span></div><div class="staff-list">${d.audit.map(a=>`<div class="staff-row"><span><strong>${esc(a.action)}</strong><small>${esc(a.actor)} · ${when(a.created_at)}</small></span><span class="staff-message">${esc(a.detail)}</span><span></span></div>`).join('')||'<div class="empty">no moderation history</div>'}</div></section>`;document.getElementById('moderation-action').onsubmit=async e=>{e.preventDefault();try{await staffPost('/api/v1/staff/moderation',e.currentTarget);const refreshed=await staffFetch('/api/v1/staff/moderation?user='+u.id);renderPlayerReview(target,refreshed)}catch(error){staffFormFailure(e.currentTarget,error)}}}
    async function staffAppeals(panel){const d=await staffFetch('/api/v1/staff/appeals');panel.innerHTML=`<div class="section-head"><h2>appeals</h2><span class="eyebrow">review does not silently change account state</span></div><div class="staff-list">${d.appeals.map(a=>`<div class="staff-row"><span><strong>#${a.id} · ${esc(a.user)}</strong><small>${flag(a.country)} ${esc(a.kind)} · ${when(a.created_at)}</small></span><span><span class="staff-badge ${a.status==='denied'?'bad':''}">${esc(a.status)}</span><div class="staff-message">${esc(a.message)}</div>${a.resolution?`<small>${esc(a.reviewer)}: ${esc(a.resolution)}</small>`:''}</span><span>${a.status==='open'?`<button class="quiet-action" type="button" data-appeal="${a.id}">review</button>`:''}</span></div>`).join('')||'<div class="empty">no appeals</div>'}</div><form class="inline-form" id="appeal-decision"><input name="appeal_id" inputmode="numeric" placeholder="appeal id" required><select name="decision"><option value="accepted">accept</option><option value="denied">deny</option></select><input name="resolution" minlength="3" maxlength="2000" placeholder="resolution" required><button class="action" type="submit">save decision</button></form>`;document.querySelectorAll('[data-appeal]').forEach(b=>b.onclick=()=>{panel.querySelector('[name=appeal_id]').value=b.dataset.appeal;panel.querySelector('[name=resolution]').focus()});document.getElementById('appeal-decision').onsubmit=async e=>{e.preventDefault();try{await staffPost('/api/v1/staff/appeals',e.currentTarget);staffAppeals(panel)}catch(error){staffFormFailure(e.currentTarget,error)}}}
    async function staffAudit(panel){const d=await staffFetch('/api/v1/staff/audit');panel.innerHTML=`<div class="section-head"><h2>audit trail</h2><span class="eyebrow">last ${d.events.length}</span></div><div class="staff-list">${d.events.map(e=>`<div class="staff-row"><span><strong>${esc(e.action)}</strong><small>${esc(e.actor)} · ${when(e.created_at)}</small></span><span class="staff-message">${esc(e.target)}</span><span class="staff-message">${esc(e.detail)}</span></div>`).join('')||'<div class="empty">no audit events</div>'}</div>`}
    async function staffChannels(panel){const d=await staffFetch('/api/v1/staff/channels');panel.innerHTML=`<div class="section-head"><h2>channels</h2><span class="eyebrow">persistent policy</span></div><div class="staff-list">${d.channels.map(c=>`<div class="staff-row"><span><strong>${esc(c.name)}</strong><small>${esc(c.topic)}</small></span><span><span class="staff-badge ${c.locked?'bad':''}">${c.locked?'locked':'open'}</span><small>write mask ${c.write_privileges} · updated ${when(c.updated_at)}</small></span><span><button class="quiet-action" type="button" data-channel="${esc(c.name)}" data-channel-action="${c.locked?'unlock':'lock'}">${c.locked?'unlock':'lock'}</button></span></div>`).join('')}</div><form class="inline-form" id="channel-action"><input name="channel" placeholder="#channel" required><select name="action"><option value="lock">lock</option><option value="unlock">unlock</option></select><input name="reason" minlength="3" maxlength="1000" placeholder="reason" required><button class="action" type="submit">apply</button></form>`;document.querySelectorAll('[data-channel]').forEach(b=>b.onclick=()=>{panel.querySelector('[name=channel]').value=b.dataset.channel;panel.querySelector('[name=action]').value=b.dataset.channelAction;panel.querySelector('[name=reason]').focus()});document.getElementById('channel-action').onsubmit=async e=>{e.preventDefault();try{await staffPost('/api/v1/staff/channels',e.currentTarget);staffChannels(panel)}catch(error){staffFormFailure(e.currentTarget,error)}}}
    async function staffLogin(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('button'),error=form.querySelector('.form-error'),data=new URLSearchParams(new FormData(form));button.disabled=true;error.textContent='';try{const response=await fetch('/api/v1/staff/session',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:data,cache:'no-store'}),json=await response.json();form.elements.password.value='';if(!response.ok)throw new Error(json.error||'sign in failed');staffSession=json;staffWorkspace()}catch(e){error.textContent=e.message;button.disabled=false}}
    async function staffLogout(){const response=await fetch('/api/v1/staff/session',{method:'DELETE',headers:{'x-csrf-token':staffSession.csrf},cache:'no-store'});if(!response.ok)throw new Error('sign out failed');staffSession=null;staffLoginView()}
    async function staff(){active('staff');const response=await fetch('/api/v1/staff/session',{cache:'no-store'});if(response.status===401||response.status===403)return staffLoginView();if(!response.ok)throw new Error('staff session is not answering');staffSession=await response.json();staffWorkspace()}
    async function route(){try{const p=location.pathname;if(p==='/')return home();if(p==='/rankings')return rankings();if(p==='/appeal')return appeal();if(p==='/staff')return staff();if(/^\/u\/\d+$/.test(p))return profile(p.split('/')[2]);if(/^\/beatmapsets\/\d+$/.test(p))return beatmap(p.split('/')[2]);throw new Error('not found')}catch(e){app.innerHTML=`<div class="empty error">${esc(e.message)}</div>`}}
    document.getElementById('host').textContent=location.hostname;route();
  </script>
</body>
</html>
