<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080808">
  <title>kai / zigcho</title>
  <style>
    :root{--bg:#080808;--text:#e7e3df;--muted:#88817d;--line:#282326;--pink:#ed83b6}
    *{box-sizing:border-box}html{background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}body{margin:0}
    main{width:min(720px,calc(100% - 32px));min-height:100svh;margin:auto;display:flex;flex-direction:column;justify-content:center;padding:48px 0}
    header{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
    h1{margin:0;font:600 22px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.03em}h1 span,.state{color:var(--pink)}
    .state{display:flex;align-items:center;gap:7px;font-size:11px}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
    .copy{margin:42px 0 30px;max-width:530px;color:var(--muted)}.copy strong{color:var(--text);font-weight:500}
    dl{display:grid;grid-template-columns:repeat(5,1fr);margin:0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    dl div+div{border-left:1px solid var(--line);padding-left:16px}dt{color:var(--muted);font-size:10px}dd{margin:5px 0 0;font-size:18px}
    .water{position:relative;height:76px;margin-top:34px;overflow:hidden;border-bottom:1px dashed var(--line)}
    .boat-run{position:absolute;left:-58px;bottom:8px;width:50px;height:38px;animation:sail 18s linear infinite}.boat{position:relative;width:50px;height:38px;animation:bob 2.4s ease-in-out infinite}
    .mast{position:absolute;left:27px;top:1px;width:1px;height:22px;background:var(--muted)}.sail{position:absolute;left:12px;top:3px;width:14px;height:17px;border-right:1px solid var(--pink);border-bottom:1px solid var(--pink);transform:skewY(-24deg)}.hull{position:absolute;left:4px;top:25px;width:43px;height:8px;border-top:1px solid var(--text);border-radius:0 0 60% 50%}.wake{position:absolute;right:43px;top:33px;width:28px;border-top:1px dashed var(--pink);opacity:.55}
    footer{display:flex;justify-content:space-between;margin-top:13px;color:var(--muted);font-size:10px}
    .updating dd{opacity:.45}@keyframes sail{to{transform:translateX(778px)}}@keyframes bob{50%{transform:translateY(-3px) rotate(1deg)}}
    @media(max-width:580px){dl{grid-template-columns:repeat(2,1fr);gap:18px 0}dl div+div{border-left:0;padding-left:0}dl div:nth-child(even){border-left:1px solid var(--line);padding-left:16px}.copy{margin-top:34px}}
    @media(prefers-reduced-motion:reduce){.boat-run,.boat{animation:none}.boat-run{left:45%}}
  </style>
</head>
<body>
  <main>
    <header><h1>kai<span>.</span></h1><div class="state"><i class="dot"></i><span id="state">checking</span></div></header>
    <p class="copy"><strong>this is the small bit that tells you if the server is alive.</strong> zigcho is still running as a Debug alpha while stable, lazer, chat and multiplayer are finished properly.</p>
    <dl id="stats">
      <div><dt>online</dt><dd id="online">—</dd></div>
      <div><dt>accounts</dt><dd id="users">—</dd></div>
      <div><dt>plays</dt><dd id="plays">—</dd></div>
      <div><dt>passed</dt><dd id="passed">—</dd></div>
      <div><dt>maps</dt><dd id="maps">—</dd></div>
    </dl>
    <div class="water" aria-label="a small boat moving across the page"><div class="boat-run" aria-hidden="true"><div class="boat"><i class="mast"></i><i class="sail"></i><i class="hull"></i><i class="wake"></i></div></div></div>
    <footer><span id="host">kai.ovh</span><span>debug alpha / bancho protocol 19</span></footer>
  </main>
  <script>
    const stats=document.getElementById('stats'),state=document.getElementById('state');
    document.getElementById('host').textContent=location.hostname;
    async function refresh(){stats.classList.add('updating');try{const r=await fetch('/api/v1/status',{cache:'no-store'});if(!r.ok)throw new Error();const d=await r.json();for(const key of ['online','users','plays','passed','maps'])document.getElementById(key).textContent=Number(d[key]).toLocaleString();state.textContent='live';}catch{state.textContent='not answering';}finally{stats.classList.remove('updating')}}
    refresh();setInterval(refresh,15000);
  </script>
</body>
</html>
