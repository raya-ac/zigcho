    async function staffFetch(path,options={}){const headers={...(options.headers||{})};if(options.method&&options.method!=='GET')headers['x-csrf-token']=staffSession.csrf;const response=await fetch(path,{...options,headers,cache:'no-store'});let json={};try{json=await response.json()}catch{}if(response.status===401){staffSession=null;staffLoginView('your staff session ended');throw new Error('session ended')}if(!response.ok)throw new Error(json.error||'request failed');return json}

    async function staffAppeals(panel){const d=await staffFetch('/api/v1/staff/appeals');panel.innerHTML=`<div class="section-head"><h2>appeals</h2><span class="eyebrow">review does not silently change account state</span></div><div class="staff-list">${d.appeals.map(a=>`<div class="staff-row"><span><strong>#${a.id} · ${esc(a.user)}</strong><small>${flag(a.country)} ${esc(a.kind)} · ${when(a.created_at)}</small></span><span><span class="staff-badge ${a.status==='denied'?'bad':''}">${esc(a.status)}</span><div class="staff-message">${esc(a.message)}</div>${a.resolution?`<small>${esc(a.reviewer)}: ${esc(a.resolution)}</small>`:''}</span><span>${a.status==='open'?`<button class="quiet-action" type="button" data-appeal="${a.id}">review</button>`:''}</span></div>`).join('')||'<div class="empty">no appeals</div>'}</div><form class="inline-form" id="appeal-decision"><input name="appeal_id" inputmode="numeric" placeholder="appeal id" required><select name="decision"><option value="accepted">accept</option><option value="denied">deny</option></select><input name="resolution" minlength="3" maxlength="2000" placeholder="resolution" required><button class="action" type="submit">save decision</button></form>`;document.querySelectorAll('[data-appeal]').forEach(b=>b.onclick=()=>{panel.querySelector('[name=appeal_id]').value=b.dataset.appeal;panel.querySelector('[name=resolution]').focus()});document.getElementById('appeal-decision').onsubmit=async e=>{e.preventDefault();try{await staffPost('/api/v1/staff/appeals',e.currentTarget);staffAppeals(panel)}catch(error){staffFormFailure(e.currentTarget,error)}}}
    async function staffAnticheat(panel){const d=await staffFetch('/api/v1/staff/anticheat');panel.innerHTML=`<div class="section-head"><h2>anticheat review</h2><span class="eyebrow">${d.pending} pending · observe only</span></div><p>labels are calibration data. they do not restrict players, remove scores, or change stats.</p><div class="staff-list">${d.observations.map(o=>`<div class="staff-row"><span><strong>#${o.id} · ${esc(o.user)}</strong><small>${o.score_id?'score '+o.score_id+' · ':''}${esc(o.source)} · ${when(o.created_at)}</small><small>${esc(o.module)} · rule ${o.rule_revision}${o.sample_weight>1?' · sample weight '+o.sample_weight:''}${o.replay_match_count?' · '+o.replay_match_count+' other account match(es)':''}</small></span><span><span class="staff-badge ${o.review_label==='cheat'?'bad':''}">${esc(o.review_label)}</span><small>action ${o.action} · reason ${o.reason} · risk ${o.risk} · confidence ${(o.confidence_bps/100).toFixed(2)}%</small>${o.objects?`<small>${o.objects} objects · ${o.clicks} clicks · exact ${(o.exact_timing_bps/100).toFixed(2)}% · centre ${(o.center_hits_bps/100).toFixed(2)}% · ${o.snaps} snaps</small>`:''}${o.key_press_count?`<small>${o.key_press_count} presses · ${o.key_hold_count} holds · alternate ${(o.alternation_bps/100).toFixed(2)}% · hold spread ${(o.hold_duration_stddev_milli/1000).toFixed(2)}ms</small>`:''}${o.velocity_spike_count||o.target_distance_stddev_milli?`<small>${o.velocity_spike_count} velocity spikes · target spread ${(o.target_distance_stddev_milli/1000).toFixed(2)}px</small>`:''}${o.review_note?`<div class="staff-message">${esc(o.reviewer)}: ${esc(o.review_note)}</div>`:''}</span><span><button class="quiet-action" type="button" data-ac-review="${o.id}">review</button></span></div>`).join('')||'<div class="empty">no anticheat observations yet</div>'}</div><form class="inline-form" id="anticheat-review"><input name="observation_id" inputmode="numeric" placeholder="observation id" required><select name="label"><option value="clean">clean</option><option value="uncertain">uncertain</option><option value="cheat">cheat</option><option value="dismissed">dismissed</option></select><input name="note" minlength="3" maxlength="1000" placeholder="what did you verify?" required><button class="action" type="submit">save label</button></form>`;document.querySelectorAll('[data-ac-review]').forEach(b=>b.onclick=()=>{panel.querySelector('[name=observation_id]').value=b.dataset.acReview;panel.querySelector('[name=note]').focus()});document.getElementById('anticheat-review').onsubmit=async e=>{e.preventDefault();try{await staffPost('/api/v1/staff/anticheat',e.currentTarget);staffAnticheat(panel)}catch(error){staffFormFailure(e.currentTarget,error)}}}

    async function route(){try{const p=location.pathname;if(p==='/')return await home();if(p==='/rankings'||/^\/users\/?$/.test(p))return await rankings();if(p==='/login')return accountLogin();if(p==='/settings')return await accountSettings();if(p==='/appeal')return appeal();if(p==='/staff')return await staff();if(/^\/(?:u|users)\/[^/]+\/?$/.test(p)){let identifier;try{identifier=decodeURIComponent(p.split('/')[2])}catch{return playerNotFound('')}try{return await profile(identifier)}catch(e){if(e instanceof HttpError&&e.status===404)return playerNotFound(identifier);throw e}}if(/^\/beatmapsets\/\d+\/?$/.test(p)){try{return await beatmap(p.split('/')[2])}catch(e){if(e instanceof HttpError&&e.status===404)return beatmapNotFound();throw e}}return routeNotFound()}catch(e){if(e instanceof HttpError&&e.status===404)return routeNotFound();return temporaryError()}}
    let profilePresenceTimer=0;async function refreshProfilePresence(identifier){try{const data=await get('/api/v1/users/'+encodeURIComponent(identifier)+'?source=all&mode=0'),presence=data.presence||{online:false,client_label:'offline',activity:'offline',detail:''},target=document.getElementById('profile-presence');if(target)target.innerHTML=`<div class="presence-line ${presence.online?'':'offline'}"><i class="dot"></i>${presence.online?'online · '+esc(presence.client_label):'offline'}</div>${presence.online?`<div class="presence-detail">${esc(presence.activity)}${presence.detail?' · '+esc(presence.detail):''}</div>`:''}`;return data}catch{return null}}const profileWithScores=profile;profile=async function(identifier){clearInterval(profilePresenceTimer);await profileWithScores(identifier);const recent=document.getElementById('recent-plays'),profileInfo=document.querySelector('.profile-head>div');if(!recent)return;if(profileInfo)profileInfo.insertAdjacentHTML('beforeend','<div id="profile-presence"></div>');const data=await refreshProfilePresence(identifier);if(data)recent.insertAdjacentHTML('afterend',`<section class="section" id="achievements"><div class="section-head"><h2>achievements</h2><span class="eyebrow">${(data.achievements||[]).length} unlocked</span></div>${achievementRows(data.achievements||[])}</section>`);profilePresenceTimer=setInterval(()=>refreshProfilePresence(identifier),15000)}
    const renderPlayerReviewBase=renderPlayerReview;renderPlayerReview=function(target,data){renderPlayerReviewBase(target,data);const form=target.querySelector('#moderation-action'),select=form&&form.elements.action;if(!select)return;const kick=document.createElement('option');kick.value='kick';kick.textContent='kick from Stable or lazer';select.insertBefore(kick,select.firstChild);form.insertAdjacentHTML('beforebegin','<section class="section"><div class="section-head"><h2>live controls</h2><span class="eyebrow">audited</span></div><p>kick disconnects Stable, revokes active lazer game tokens, and closes lazer multiplayer or spectator sockets. silence, restriction, notes, role changes, hardware evidence, ranking controls, channel locks, appeals and anticheat review are all available in this workspace.</p></section>')};
