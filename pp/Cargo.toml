[package]
name = "zigcho-pp"
version = "0.2.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
akatsuki-pp = { git = "https://github.com/osuAkatsuki/akatsuki-pp-rs", rev = "591de0db4948f2c504ca6e2ca3db442f09103ef1" }
rosu-map = "=0.2.1"
rosu-pp-stable = { package = "rosu-pp", version = "=4.0.1" }
rosu-pp-lazer = { package = "rosu-pp", git = "https://github.com/kaibi-dev/rosu-pp", rev = "1129a7e79d689fc705bf93fb2f2a6411825ba545" }
rosu-mods = { version = "=0.4.1", features = ["serde"] }
serde_json = "=1.0.149"

[profile.release]
codegen-units = 16
lto = "off"
panic = "unwind"
strip = "debuginfo"
