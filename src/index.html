    function structurePageView(){const view=app.firstElementChild;if(!view||view.classList.contains('profile-view'))return;view.classList.add('page-view');const path=location.pathname.replace(/\/+$/,'')||'/',service=!!serviceHosts[location.hostname];let type='content';if(service)type='service';else if(view.classList.contains('error-page'))type='system-error';else if(view.classList.contains('account-shell'))type=siteSession?'settings':'login';else if(view.classList.contains('chat-shell'))type=siteSession?'chat-workspace':'chat-gate';else if(path==='/')type='home';else if(path==='/rankings'||path==='/users')type='rankings';else if(path==='/multiplayer')type='multiplayer-index';else if(/^\/multiplayer\/\d+$/.test(path))type='multiplayer-detail';else if(path==='/teams')type='teams-index';else if(/^\/teams\/\d+$/.test(path))type='team-detail';else if(path==='/changelog')type='changelog';else if(path==='/appeal')type='appeal';else if(path==='/staff')type=staffSession?'staff-workspace':'staff-login';else if(/^\/beatmapsets\/\d+$/.test(path))type='map-detail';view.classList.add(type+'-view');view.dataset.pageType=type;const fallbackTitle=({'/rankings':'rankings','/appeal':'appeal','/staff':'staff'})[path];if(fallbackTitle&&(document.title==='kai'||!document.title))document.title=fallbackTitle+' · kai';const head=view.querySelector(':scope>.intro');if(head){head.classList.add('page-head');const filters=head.querySelector(':scope>.mode-filters');if(filters){let bar=view.querySelector(':scope>.page-mode-bar');if(!bar){bar=document.createElement('section');bar.className='page-mode-bar';bar.setAttribute('aria-label','score filters');head.after(bar)}bar.append(filters)}}view.querySelector(':scope>.stats')?.classList.add('data-strip');view.querySelectorAll(':scope>.section').forEach(section=>section.classList.add('page-section'));const auth=view.querySelector(':scope>.staff-auth');if(auth)auth.classList.add('auth-sheet');const tabs=view.querySelector(':scope>.staff-tabs');if(tabs)     const pageLayoutObserver=new MutationObserver(structurePageView);pageLayoutObserver.observe(app,{childList:true});structurePageView();
    async function bindProfileNameHistory(identifier){const view=document.querySelector('.profile-view'),name=view&&view.querySelector('.profile-name'),row=name&&name.closest('.profile-name-row');if(!view||!name||!row||row.querySelector('.profile-name-history'))return;let data;try{data=await get('/api/v1/users/'+encodeURIComponent(identifier)+'/name-history')}catch{return}if(document.querySelector('.profile-view')!==view||!Array.isArray(data.history)||!data.history.length)return;const cluster=document.createElement('div'),history=document.createElement('details'),menuId='profile-name-history-'+String(data.id||identifier).replace(/[^a-zA-Z0-9_-]/g,'');cluster.className='profile-name-cluster';history.className='profile-name-history';history.innerHTML=`<summary aria-label="show previous usernames" aria-controls="${esc(menuId)}"><i aria-hidden="true">⌄</i></summary><div class="profile-name-history-menu" id="${esc(menuId)}"><span class="eyebrow">previous usernames</span><div class="name-history-list">${data.history.map(entry=>`<span class="name-history-entry"><strong>${esc(entry.name)}</strong><time datetime="${new Date(Number(entry.changed_at)*1000).toISOString()}">${new Date(Number(entry.changed_at)*1000).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}</time></span>`).join('')}</div></div>`;name.before(cluster);cluster.append(history,name)}
    let profilePresenceTimer=0;
    async function refreshProfilePresence(identifier){try{const data=await get('/api/v1/users/'+encodeURIComponent(identifier)+'?source=all&mode=0'),presence=data.presence||{online:false,client_label:'offline',activity:'offline',detail:''},target=document.getElementById('profile-presence');if(target)target.innerHTML=`<div class="presence-line ${presence.online?'':'offline'}"><i class="dot"></i>${presence.online?'online · '+esc(presence.client_label):'offline'}</div>${presence.online?`<div class="presence-detail">${esc(presence.activity)}${presence.detail?' · '+esc(presence.detail):''}</div>`:''}`;return data}catch{return null}}
    function structureProfileHeader(){const view=document.querySelector('.profile-view'),head=view&&view.querySelector('.profile-head');if(!view||!head)return;const isBot=view.classList.contains('accent-bot');let cover=view.querySelector('.profile-cover');if(!cover){cover=document.createElement('div');cover.className='profile-cover';const banner=view.querySelector('.profile-banner');if(banner)cover.append(banner);else cover.classList.add('empty');view.insertBefore(cover,head)}const info=head.querySelector(':scope>div');if(info){info.classList.add('profile-copy');const name=info.querySelector('.profile-name');if(name&&!info.querySelector('.profile-name-row')){const row=document.createElement('div'),tools=document.createElement('div');row.className='profile-name-row';tools.className='profile-head-tools';name.before(row);row.append(name);if(!isBot){const presence=document.createElement('div');presence.className='profile-presence-shell';presence.id='profile-presence';presence.setAttribute('aria-live','polite');presence.innerHTML='<div class="presence-line offline"><i class="dot"></i>checking presence</div>';tools.append(presence)}const actions=info.querySelector('.profile-actions');if(actions){const edit=actions.querySelector('a');if(edit){edit.classList.remove('text-link');edit.classList.add('quiet-action');edit.textContent='edit profile'}tools.append(actions)}if(tools.childElementCount)row.append(tools)}if(!isBot){const facts=info.querySelector('.meta'),details=info.querySelector('.profile-details');if(facts&&!facts.classList.contains('profile-facts')){facts.classList.remove('meta');facts.classList.add('profile-facts');const roles=document.createElement('div'),badges=facts.querySelector('.role-badges'),team=facts.querySelector('.team-link'),joined=Array.from(facts.children).find(item=>item.textContent.startsWith('joined '));roles.className='profile-roles';if(badges)roles.append(badges);if(team)roles.append(team);facts.before(roles);if(details){while(details.firstChild)facts.insertBefore(details.firstChild,joined||null);details.remove()}}}}const modeBar=view.querySelector('.mode-bar');if(modeBar&&!modeBar.classList.contains('profile-mode-bar')){modeBar.classList.add('profile-mode-bar');modeBar.setAttribute('aria-label','score filters')}}
    const profileWithScores=profile;profile=async function(identifier){clearInterval(profilePresenceTimer);stopMappedPreview();await profileWithScores(identifier);structureProfileHeader();if(document.querySelector('.profile-view.accent-bot'))return;bindProfileNameHistory(identifier);const recent=document.getElementById('recent-plays'),mapped=document.getElementById('mapped-beatmaps');if(!recent)return;if(mapped)recent.after(mapped);bindMappedSetPreviews();const data=await refreshProfilePresence(identifier),achievementAnchor=mapped||recent;if(data){if(siteSession&&data.id===siteSession.user.id)active('account');achievementAnchor.insertAdjacentHTML('afterend',`<section class="section" id="achievements"><div class="section-head"><h2>achievements</h2><span class="eyebrow">${(data.achievements||[]).length} unlocked</span></div>${achievementRows(data.achievements||[])}</section>`)}profilePresenceTimer=setInterval(()=>refreshProfilePresence(identifier),15000)}
    const renderPlayerReviewBase=renderPlayerReview;renderPlayerReview=function(target,data){renderPlayerReviewBase(target,data);const form=target.querySelector('#moderation-action');if(!form)return;form.insertAdjacentHTML('beforebegin','<section class="section"><div class="section-head"><h2>live controls</h2><span class="eyebrow">audited</span></div><p>kick disconnects Stable, revokes active lazer game tokens, and closes lazer multiplayer or spectator sockets. session revocation, profile resets, silence, restriction, notes, role changes, hardware evidence, ranking controls, channel locks, reports, appeals and anticheat review all live here.</p></section>')};
    function anticheatFacts(items,kind){if(!items||!items.length)return '<span class="anticheat-empty">none reported</span>';return `<div class="anticheat-facts">${items.map(item=>`<div class="anticheat-fact"><strong>${esc(item.display||item.name)}${item.mask?' · '+esc(item.mask):''}</strong><small>${esc(item.description)}</small></div>`).join('')}</div>`}
    function anticheatMetricFacts(items){if(!items||!items.length)return '<span class="anticheat-empty">no gameplay metrics for this signal</span>';return `<div class="anticheat-facts">${items.map(item=>`<div class="anticheat-fact"><strong>${esc(item.label)} · ${esc(item.display)}</strong><small>${esc(item.description)}</small></div>`).join('')}</div>`}
    function anticheatObservationRows(observations){return observations.map(o=>{const m=o.meaning||{},action=m.action||{display:`action ${o.action}`,description:'no decoder metadata'},reason=m.reason||{display:`reason ${o.reason}`,description:'no decoder metadata'},risk=m.risk||{value:o.risk,display:`${o.risk} / 1000`},confidence=m.confidence||{display:`${(o.confidence_bps/100).toFixed(2)}%`},revision=m.rule_revision||{display:`revision ${o.rule_revision}`},riskWidth=Math.max(0,Math.min(100,Number(risk.value||0)/10)),danger=action.name==='restrict'?'bad':'',exclusion=o.review_exclusion;return `<div class="staff-row anticheat-row"><span><strong>#${o.id} · ${esc(o.user)}</strong><small>${o.score_id?'score '+o.score_id+' · ':''}${esc(o.source)} · ${when(o.created_at)}</small><small>${esc(o.module)} · ${esc(revision.display)}${o.sample_weight>1?' · 1 in '+o.sample_weight+' sampled allow decision':''}</small><span class="staff-badge ${o.review_label==='cheat'?'bad':''}">${esc(o.review_label)}</span>${o.review_suppressed?'<span class="staff-badge">review suppressed</span>':''}</span><span class="anticheat-main"><span class="anticheat-verdict"><strong class="anticheat-action ${danger}">proposed ${esc(action.display)}</strong><span class="anticheat-reason">${esc(reason.display)}</span></span><p class="anticheat-explanation">${esc(reason.description)}</p><p class="anticheat-explanation">${esc(action.description)}. ${esc(m.outcome||'no automatic player or score action was applied')}</p>${exclusion?`<div class="staff-message">review queue suppressed by ${esc(exclusion.created_by)} for ${esc(exclusion.scope)} until ${when(exclusion.expires_at)} · ${esc(exclusion.reason)}${exclusion.revoked_at?' · later revoked by '+esc(exclusion.revoked_by):''}</div>`:''}<span class="anticheat-risk"><span>${esc(risk.display)}</span><span class="anticheat-risk-track"><i style="width:${riskWidth}%"></i></span><span>${esc(confidence.display)} rule confidence</span></span><details class="anticheat-detail"><summary>evidence, requested flags and gameplay metrics</summary><div class="anticheat-group"><span>evidence</span>${anticheatFacts(m.evidence,'evidence')}</div><div class="anticheat-group"><span>module requests</span>${anticheatFacts(m.decision_flags,'flags')}</div><div class="anticheat-group"><span>gameplay</span>${anticheatMetricFacts(m.metrics)}</div></details>${o.review_note?`<div class="staff-message">${esc(o.reviewer)}: ${esc(o.review_note)}</div>`:''}</span><span><button class="quiet-action" type="button" data-ac-review="${o.id}">review</button></span></div>`}).join('')||'<div class="empty">no anticheat observations yet</div>'}
    function anticheatExclusionRows(exclusions,canManage){return exclusions.map(x=>{const state=x.active?'active':x.revoked_at?'revoked':'expired';return `<div class="staff-row"><span><strong>#${x.id} · ${esc(x.user)}</strong><small>${esc(x.scope)} · ${state} · created by ${esc(x.created_by)}</small></span><span class="staff-message">${esc(x.reason)}<small>${when(x.created_at)} → ${when(x.expires_at)}${x.revoked_at?' · revoked '+when(x.revoked_at)+' by '+esc(x.revoked_by)+' · '+esc(x.revoke_reason):''}</small></span><span>${canManage&&x.active?`<form data-ac-exclusion-revoke><input type="hidden" name="action" value="revoke"><input type="hidden" name="exclusion_id" value="${x.id}"><input name="reason" minlength="3" maxlength="500" placeholder="revocation reason" required><button class="quiet-action" type="submit">revoke</button></form>`:`<span class="staff-badge ${state==='active'?'bad':''}">${state}</span>`}</span></div>`}).join('')||'<div class="empty">no exclusion history</div>'}
    async function staffAnticheatDecoded(panel){const d=await staffFetch('/api/v1/staff/anticheat'),policy=d.policy||{},observations=d.observations||[],exclusions=d.exclusions||[],canManage=staffCan.admin(staffSession.user);panel.innerHTML=`<div class="section-head"><h2>anticheat review</h2><span class="eyebrow">${d.pending} pending · ${d.suppressed_pending||0} suppressed · observe only</span></div><p>${esc(policy.outcome||'module output is recorded for human review and is not enforced automatically.')}</p><p class="anticheat-explanation">risk runs from 0 to 1000 and only sets review priority. rule confidence is the module confidence in its selected reason, stored as basis points. neither number is a verdict.</p><p class="anticheat-explanation"><strong>review labels:</strong> clean means reviewed benign; uncertain means insufficient evidence; cheat means verified cheating; dismissed means invalid or duplicate evidence.</p><section class="section"><div class="section-head"><h2>review exclusions</h2><span class="eyebrow">queue suppression only · evidence still collected</span></div><p>an exclusion never skips detection, replay fingerprints, hardware evidence, or audit records. it only keeps matching future observations out of the default pending count until expiry or revocation.</p>${canManage?`<form class="inline-form" id="anticheat-exclusion-create"><input type="hidden" name="action" value="create"><input name="user" placeholder="exact player name or id" autocomplete="off" required><select name="scope"><option value="all">all stable signals</option><option value="stable_login">stable login</option><option value="stable_lastfm">stable client flags</option><option value="stable_score">stable scores</option></select><select name="duration_seconds"><option value="3600">1 hour</option><option value="86400">1 day</option><option value="604800">7 days</option><option value="2592000">30 days</option></select><input name="reason" minlength="3" maxlength="500" placeholder="why should review be suppressed?" required><button class="action" type="submit">review & apply</button></form>`:'<p class="anticheat-explanation">administrator access is required to create or revoke exclusions.</p>'}<div class="staff-list">${anticheatExclusionRows(exclusions,canManage)}</div></section><section class="section"><div class="section-head"><h2>observations</h2><span class="eyebrow">suppressed evidence remains visible and reviewable</span></div><div class="staff-list anticheat-list">${anticheatObservationRows(observations)}</div></section><form class="inline-form" id="anticheat-review"><input name="observation_id" inputmode="numeric" placeholder="observation id" required><select name="label"><option value="clean">clean · reviewed benign</option><option value="uncertain">uncertain · insufficient evidence</option><option value="cheat">cheat · verified cheating</option><option value="dismissed">dismissed · invalid or duplicate evidence</option></select><input name="note" minlength="3" maxlength="1000" placeholder="what did you verify?" required><button class="action" type="submit">save label</button></form>`;panel.querySelectorAll('[data-ac-review]').forEach(button=>button.onclick=()=>{panel.querySelector('[name=observation_id]').value=button.dataset.acReview;panel.querySelector('[name=note]').focus()});document.getElementById('anticheat-review').onsubmit=async event=>{event.preventDefault();try{await staffPost('/api/v1/staff/anticheat',event.currentTarget);staffAnticheat(panel)}catch(error){staffFormFailure(event.currentTarget,error)}};const create=document.getElementById('anticheat-exclusion-create');if(create)create.onsubmit=async event=>{event.preventDefault();try{await staffPost('/api/v1/staff/anticheat/exclusions',event.currentTarget);staffAnticheat(panel)}catch(error){staffFormFailure(event.currentTarget,error)}};panel.querySelectorAll('[data-ac-exclusion-revoke]').forEach(form=>form.onsubmit=async event=>{event.preventDefault();try{await staffPost('/api/v1/staff/anticheat/exclusions',event.currentTarget);staffAnticheat(panel)}catch(error){staffFormFailure(event.currentTarget,error)}})}
    document.getElementById('host').textContent=location.hostname;loadSiteSession().then(()=>location.pathname==='/'&&serviceHosts[location.hostname]?serviceHome():route());
