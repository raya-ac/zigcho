name: stable conformance contracts

on:
  pull_request:
    paths:
      - src/**
      - tools/stable-conformance/**
      - .github/workflows/stable-conformance.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - tools/stable-conformance/**
      - .github/workflows/stable-conformance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: inventory, corpus and decoder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out zigcho
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: use the supported Python floor
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: verify the Stable source inventory
        run: python3 tools/stable-conformance/run.py inventory

      - name: verify complete transcript coverage
        run: python3 tools/stable-conformance/run.py validate

      - name: run focused harness tests
        run: python3 -m unittest discover -s tools/stable-conformance/tests -v
