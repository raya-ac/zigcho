name: release gates

on:
  workflow_dispatch:
    inputs:
      include_legacy_tools:
        description: also package the SQLite importers and PostgreSQL migration tool
        required: false
        default: false
        type: boolean
      test_scope:
        description: test scope for this release
        required: true
        default: full
        type: choice
        options:
          - full
          - focused
  push:
    branches:
      - main
    paths:
      - src/**
      - database/**
      - pp/**
      - deploy/Dockerfile.build
      - deploy/certbot/**
      - deploy/stunnel/**
      - deploy/systemd/**
      - tools/activate-release.sh
      - tools/activate-hotfix.sh
      - tools/backup-postgres.sh
      - tools/backup-postgres-object.sh
      - tools/hotfix.py
      - tools/restore-postgres-drill.sh
      - tools/rollback-release.sh
      - hotfixes/**
      - deploy/Dockerfile.hotfix
      - build.zig
      - build/**
      - build.zig.zon
      - changelog_module.zig
      - .github/workflows/release-gates.yml

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_hotfix: ${{ steps.classify.outputs.is_hotfix }}
      manifest: ${{ steps.classify.outputs.manifest }}
    steps:
      - name: check out enough history to verify a patch
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: classify and verify the pushed commit
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            validator="$RUNNER_TEMP/hotfix-validator.py"
            if git cat-file -e "${GITHUB_SHA}^:tools/hotfix.py" 2>/dev/null; then
              git show "${GITHUB_SHA}^:tools/hotfix.py" >"$validator"
              python3 "$validator" classify --target "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
            else
              printf 'is_hotfix=false\nmanifest=\n' >>"$GITHUB_OUTPUT"
            fi
          else
            printf 'is_hotfix=false\nmanifest=\n' >>"$GITHUB_OUTPUT"
          fi

  linux-x64:
    name: pinned linux x64 release
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: zigcho
          POSTGRES_USER: zigcho
          POSTGRES_PASSWORD: zigcho-gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zigcho -d zigcho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: check out zigcho
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: verify the dynamic changelog feed
        run: python3 tools/changelog-manifest.py --check

      - name: build the full release with the pinned production container
        if: needs.classify.outputs.is_hotfix != 'true'
        env:
          TEST_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_scope || 'full' }}
          INCLUDE_LEGACY_TOOLS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_legacy_tools || false }}
        run: docker build --build-arg "TEST_SCOPE=${TEST_SCOPE}" --build-arg "INCLUDE_LEGACY_TOOLS=${INCLUDE_LEGACY_TOOLS}" --file deploy/Dockerfile.build --tag zigcho-release-gate:${GITHUB_SHA} .

      - name: build the verified hotfix with the pinned production container
        if: needs.classify.outputs.is_hotfix == 'true'
        env:
          HOTFIX_MANIFEST: ${{ needs.classify.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --build-arg "HOTFIX_MANIFEST=${HOTFIX_MANIFEST}" \
            --cache-from type=gha,scope=zigcho-hotfix \
            --cache-to type=gha,mode=max,scope=zigcho-hotfix \
            --file deploy/Dockerfile.hotfix \
            --tag "zigcho-hotfix-gate:${GITHUB_SHA}" \
            --load \
            .

      - name: extract and verify the release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/server
          if [[ "${{ needs.classify.outputs.is_hotfix }}" == true ]]; then
            image="zigcho-hotfix-gate:${GITHUB_SHA}"
          else
            image="zigcho-release-gate:${GITHUB_SHA}"
          fi
          container=$(docker create "$image")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/out/." artifacts/server
          test -x artifacts/server/zigcho
          test -s artifacts/server/pp-engine-version
          if [[ "${{ needs.classify.outputs.is_hotfix }}" == true ]]; then
            test -x artifacts/server/tools/activate-hotfix.sh
          else
            test -x artifacts/server/zigcho-anticheat-host-smoke
            if [[ "${{ inputs.include_legacy_tools }}" == true ]]; then
              test -x artifacts/server/zigcho-import
              test -x artifacts/server/zigcho-import-archive
              test -x artifacts/server/zigcho-migrate-postgres
            fi
          fi
          binary_type=$(file -b artifacts/server/zigcho)
          printf '%s\n' "$binary_type"
          [[ "$binary_type" == *'ELF 64-bit LSB'* ]]
          [[ "$binary_type" == *'x86-64'* ]]
          [[ "$binary_type" != *'not stripped'* ]]
          if [[ "${{ needs.classify.outputs.is_hotfix }}" != true ]]; then
            smoke_type=$(file -b artifacts/server/zigcho-anticheat-host-smoke)
            [[ "$smoke_type" == *'ELF 64-bit LSB'* ]]
            [[ "$smoke_type" == *'x86-64'* ]]
            [[ "$smoke_type" != *'not stripped'* ]]
          fi
          if test -n "$(find artifacts/server -type f -name '*.pdb' -print -quit)"; then
            exit 1
          fi
          if [[ "${{ needs.classify.outputs.is_hotfix }}" == true ]]; then
            activate=artifacts/server/tools/activate-hotfix.sh
            check_line=$(grep -n '^runuser --user zigcho -- env ZIGCHO_POSTGRES_URL=.*"$candidate/zigcho" check$' "$activate" | cut -d: -f1)
            stop_line=$(grep -n '^systemctl stop "$service"$' "$activate" | tail -n 1 | cut -d: -f1)
            test "$check_line" -lt "$stop_line"
          else
            activate=artifacts/server/tools/activate-release.sh
            test -x artifacts/server/tools/rollback-release.sh
            sh -n artifacts/server/tools/rollback-release.sh
            stop_line=$(grep -n '^systemctl stop "$service"$' "$activate" | cut -d: -f1)
            stopped_line=$(grep -n '^service_stopped=yes$' "$activate" | tail -n 1 | cut -d: -f1)
            check_line=$(grep -n '^runuser --user zigcho -- env ZIGCHO_POSTGRES_URL=.*"$candidate/zigcho" check$' "$activate" | cut -d: -f1)
            anticheat_line=$(grep -n '^  runuser --user zigcho -- "$candidate/zigcho-anticheat-host-smoke" "$anticheat_module"$' "$activate" | cut -d: -f1)
            backup_verified_line=$(grep -n '^.*"$candidate/zigcho" object-put "$backup_key" "$backup")$' "$activate" | cut -d: -f1)
            test "$anticheat_line" -lt "$stop_line"
            test "$backup_verified_line" -lt "$stop_line"
            test "$stop_line" -lt "$stopped_line"
            test "$stopped_line" -lt "$check_line"
          fi

      - name: run PostgreSQL integration tests
        if: needs.classify.outputs.is_hotfix != 'true' && (github.event_name != 'workflow_dispatch' || inputs.test_scope == 'full')
        shell: bash
        env:
          PGPASSWORD: zigcho-gate
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U zigcho zigcho_pool
          createdb -h 127.0.0.1 -U zigcho zigcho_store
          createdb -h 127.0.0.1 -U zigcho zigcho_migrate
          createdb -h 127.0.0.1 -U zigcho zigcho_bss
          createdb -h 127.0.0.1 -U zigcho zigcho_room_chat
          createdb -h 127.0.0.1 -U zigcho zigcho_ranked
          createdb -h 127.0.0.1 -U zigcho zigcho_history
          createdb -h 127.0.0.1 -U zigcho zigcho_history_concurrency
          docker run --rm --network host \
            -e 'ZIGCHO_TEST_POSTGRES_URL=host=127.0.0.1 port=5432 dbname=zigcho_pool user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_STORE_URL=host=127.0.0.1 port=5432 dbname=zigcho_store user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_MIGRATE_URL=host=127.0.0.1 port=5432 dbname=zigcho_migrate user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_BSS_URL=host=127.0.0.1 port=5432 dbname=zigcho_bss user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_ROOM_CHAT_URL=host=127.0.0.1 port=5432 dbname=zigcho_room_chat user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_RANKED_URL=host=127.0.0.1 port=5432 dbname=zigcho_ranked user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_HISTORY_URL=host=127.0.0.1 port=5432 dbname=zigcho_history user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_HISTORY_CONCURRENCY_URL=host=127.0.0.1 port=5432 dbname=zigcho_history_concurrency user=zigcho password=zigcho-gate connect_timeout=5' \
            "zigcho-release-gate:${GITHUB_SHA}" \
            zig build test -Doptimize=ReleaseSafe

      - name: run focused correction tests
        if: needs.classify.outputs.is_hotfix != 'true' && github.event_name == 'workflow_dispatch' && inputs.test_scope == 'focused'
        shell: bash
        env:
          PGPASSWORD: zigcho-gate
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U zigcho zigcho_migrate
          createdb -h 127.0.0.1 -U zigcho zigcho_store
          createdb -h 127.0.0.1 -U zigcho zigcho_anticheat
          createdb -h 127.0.0.1 -U zigcho zigcho_transitions
          docker run --rm --network host \
            -e 'ZIGCHO_TEST_POSTGRES_MIGRATE_URL=host=127.0.0.1 port=5432 dbname=zigcho_migrate user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_STORE_URL=host=127.0.0.1 port=5432 dbname=zigcho_store user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_ANTICHEAT_URL=host=127.0.0.1 port=5432 dbname=zigcho_anticheat user=zigcho password=zigcho-gate connect_timeout=5' \
            -e 'ZIGCHO_TEST_POSTGRES_TRANSITIONS_URL=host=127.0.0.1 port=5432 dbname=zigcho_transitions user=zigcho password=zigcho-gate connect_timeout=5' \
            "zigcho-release-gate:${GITHUB_SHA}" \
            sh -c '
              set -eu
              for filter in \
                "feature gate" \
                "room score writes require" \
                "anticheat null signals coalesce" \
                "anticheat review exclusions" \
                "failed stable plays cannot emit behavioral shadow evidence" \
                "raw unstacked cursor output cannot become review evidence" \
                "review decoder" \
                "rejected scores cross the module boundary" \
                "rejected stable score evidence" \
                "staff anticheat renders" \
                "exact stable hardware matches remain" \
                "ranked stable PP is stored" \
                "official osu api beatmapset fallback" \
                "developer server controls persist" \
                "developer role workspace" \
                "website home leads with playable clients" \
                "public name history follows" \
                "lazer spectator v2 accepts" \
                "dynamic changelog" \
                "official lazer score bodies" \
                "lazer solo score tokens" \
                "stable and lazer share one ranked performance result per map" \
                "lazer profile JSON owns" \
                "website profile plays keep"
              do
                zig build test -Doptimize=ReleaseSafe "-Dtest-filter=$filter"
              done
              for filter in \
                "disabled multiplayer rejects REST room creation" \
                "shutdown rejects delayed websocket creation" \
                "cross client spectator disconnect waits" \
                "spectator replacement retires" \
                "expected Stable login owner mismatch" \
                "suppression clears host spectator relationships" \
                "unbound room score tokens are discarded" \
                "credential and restriction commits revoke" \
                "staff announcements persist chat and audit atomically" \
                "custom lazer plays update local map counters"
              do
                env -u ZIGCHO_TEST_POSTGRES_STORE_URL zig build test -Doptimize=ReleaseSafe "-Dtest-filter=$filter"
              done
              zig build test -Doptimize=ReleaseSafe -Dtest-filter="postgres account auth stats and token slice"
              ZIGCHO_TEST_POSTGRES_STORE_URL="$ZIGCHO_TEST_POSTGRES_ANTICHEAT_URL" zig build test -Doptimize=ReleaseSafe -Dtest-filter="postgres anticheat hardware and flags stay review only"
              ZIGCHO_TEST_POSTGRES_STORE_URL="$ZIGCHO_TEST_POSTGRES_ANTICHEAT_URL" zig build test -Doptimize=ReleaseSafe -Dtest-filter="postgres anticheat review exclusions"
              for filter in \
                "postgres staff announcements persist chat and audit atomically" \
                "postgres credential and restriction commits revoke matching token families" \
                "postgres stable score grace is client bound expiring and one time" \
                "postgres custom lazer plays update local map counters" \
                "postgres unbound room score tokens can be discarded" \
                "postgres developer role changes preserve unrelated bits"
              do
                ZIGCHO_TEST_POSTGRES_STORE_URL="$ZIGCHO_TEST_POSTGRES_TRANSITIONS_URL" zig build test -Doptimize=ReleaseSafe "-Dtest-filter=$filter"
              done
              zig build test -Doptimize=ReleaseSafe -Dtest-filter="postgres runtime migrates through stable score grace schema forty eight"
            '

      - name: compare optimized reads with their original contracts
        if: needs.classify.outputs.is_hotfix != 'true'
        env:
          PGPASSWORD: zigcho-gate
        run: |
          set -euo pipefail
          for optimization in Debug ReleaseSafe; do
            database_name="zigcho_perf_$(printf '%s' "$optimization" | tr '[:upper:]' '[:lower:]')"
            createdb -h 127.0.0.1 -U zigcho "$database_name"
            docker run --rm --network host \
              -e "ZIGCHO_TEST_POSTGRES_PERFORMANCE_URL=host=127.0.0.1 port=5432 dbname=$database_name user=zigcho password=zigcho-gate connect_timeout=5" \
              "zigcho-release-gate:${GITHUB_SHA}" \
              zig build test "-Doptimize=$optimization" -Dtest-filter="postgres batched stats and first-place query parity"
          done

      - name: verify backup ranges against an isolated HTTPS object store
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: backup-fixture-access
          AWS_SECRET_ACCESS_KEY: backup-fixture-secret
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          runtime=$(mktemp -d "$RUNNER_TEMP/backup-roundtrip.XXXXXX")
          cert_dir=$(mktemp -d "$RUNNER_TEMP/backup-certs.XXXXXX")
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$cert_dir/private.key" -out "$cert_dir/public.crt" -days 1 -subj '/CN=localhost' -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost' 2>/dev/null
          sudo cp "$cert_dir/public.crt" /usr/local/share/ca-certificates/zigcho-backup-fixture.crt
          sudo update-ca-certificates >/dev/null
          docker run -d --name zigcho-backup-objects --network host -v "$cert_dir:/root/.minio/certs:ro" -e MINIO_ROOT_USER=backup-fixture-access -e MINIO_ROOT_PASSWORD=backup-fixture-secret minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e server /data --address 127.0.0.1:19020 --console-address 127.0.0.1:19021
          trap 'docker rm -f zigcho-backup-objects >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent https://127.0.0.1:19020/minio/health/live; then break; fi
            sleep 1
          done
          aws --endpoint-url https://localhost:19020 --ca-bundle "$cert_dir/public.crt" s3api create-bucket --bucket zigcho-backup-fixture
          cp tools/fixtures/backup-object-store.ini "$runtime/config.ini"
          openssl rand -out "$runtime/source.bin" 3145745
          binary="$GITHUB_WORKSPACE/artifacts/server/zigcho"
          (cd "$runtime" && "$binary" object-put backups/fixture.dump source.bin && "$binary" object-get backups/fixture.dump restored.bin)
          cmp "$runtime/source.bin" "$runtime/restored.bin"
          sha256sum "$runtime/source.bin" "$runtime/restored.bin"

      - name: boot the exact binary on PostgreSQL
        shell: bash
        env:
          ZIGCHO_POSTGRES_URL: host=127.0.0.1 port=5432 dbname=zigcho user=zigcho password=zigcho-gate connect_timeout=5
          PGPASSWORD: zigcho-gate
        run: |
          set -euo pipefail
          artifacts/server/zigcho check
          test "$(psql -h 127.0.0.1 -U zigcho -d zigcho -Atc 'select max(version) from zigcho.schema_migrations')" = 48
          test "$(psql -h 127.0.0.1 -U zigcho -d zigcho -Atc 'select min(next_id) >= 1000000000 from zigcho.bss_counters')" = t
          artifacts/server/zigcho 127.0.0.1 18099 >artifacts/server-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; wait "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=no
          for attempt in $(seq 1 30); do
            health=$(curl --fail --silent --show-error http://127.0.0.1:18099/health || true)
            if [[ "$health" == *'"ok":true'* ]]; then
              ready=yes
              break
            fi
            sleep 1
          done
          test "$ready" = yes
          bot=$(curl --fail --silent --show-error -H 'Host: kai.ovh' 'http://127.0.0.1:18099/api/v1/users/kai?source=all&mode=0')
          [[ "$bot" == *'"is_bot":true'* ]]
          multiplayer_page=$(curl --fail --silent --show-error -H 'Host: kai.ovh' 'http://127.0.0.1:18099/multiplayer')
          [[ "$multiplayer_page" == *'<title>kai</title>'* ]]
          chat_page=$(curl --fail --silent --show-error -H 'Host: kai.ovh' 'http://127.0.0.1:18099/chat')
          [[ "$chat_page" == *'<title>kai</title>'* ]]
          realtime_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H 'Host: spectator.kai.ovh' 'http://127.0.0.1:18099/multiplayer')
          test "$realtime_status" = 401
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT
          (cd artifacts/server && sha256sum zigcho > zigcho.sha256 && sha256sum --check zigcho.sha256)

      - name: bind the source patch to the hotfix artifact
        if: needs.classify.outputs.is_hotfix == 'true'
        env:
          HOTFIX_MANIFEST: ${{ needs.classify.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/hotfix.py bundle \
            --manifest "$HOTFIX_MANIFEST" \
            --target "$GITHUB_SHA" \
            --binary artifacts/server/zigcho \
            --pp-engine-version artifacts/server/pp-engine-version \
            --output-dir artifacts/server
          test -s artifacts/server/hotfix.manifest
          test -s artifacts/server/hotfix.json
          test -s artifacts/server/source.patch
          (cd artifacts/server && sha256sum --check zigcho.sha256 && sha256sum --check source.patch.sha256)

      - name: upload the deployable release
        uses: actions/upload-artifact@v7
        with:
          name: zigcho-${{ needs.classify.outputs.is_hotfix == 'true' && 'hotfix-' || '' }}linux-x64-${{ github.sha }}
          path: artifacts/server
          if-no-files-found: error
          retention-days: 30
