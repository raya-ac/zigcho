# zigcho runs behind a loopback TLS reverse proxy. bind, port, and database
# are command-line/environment settings; this file only holds runtime options.

# replaceable .osz cache ceiling in bytes (default 2 GiB, minimum 128 MiB)
beatmap_cache_max_bytes=2147483648

# cached Stable thumbnails, cover variants, and song previews (default 512 MiB)
beatmap_media_cache_max_bytes=536870912

# Discord webhook for score submissions (fire-and-forget, never blocks)
score_webhook=

# legacy osu!api key used only to resolve official mapper ids and public profile
# statistics. it is never returned or written to logs.
osu_api_key=

# authenticated IRC bridge. keep this loopback-only and put TLS in front of it.
# 0 disables IRC; production uses 16667 internally and 6697 at the TLS edge.
irc_bind=127.0.0.1
irc_port=0

# optional private v1 anticheat module; unloaded means the score path is unchanged
anticheat_module_path=
# keep one in every N allowed score decisions for clean calibration; 0 disables it
anticheat_allow_sample_modulus=100

# private Cloudflare R2 bucket used for custom profile pictures
avatar_r2_endpoint=https://23309d0f8407c82c3bd8406673bf3bec.r2.cloudflarestorage.com
avatar_r2_bucket=avatar
avatar_r2_access_key_id=
avatar_r2_secret_access_key=

# private S3-compatible object storage used for beatmap archives, media, and
# new custom avatars. use the actual S3 bucket name, not a tenant-qualified
# dashboard URL. leave blank to keep database-backed maps and legacy avatar R2.
object_storage_endpoint=
object_storage_bucket=
object_storage_region=default
object_storage_access_key_id=
object_storage_secret_access_key=
