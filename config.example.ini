# zigcho runs behind a loopback TLS reverse proxy. bind, port, and database
# are command-line/environment settings; this file only holds runtime options.

# replaceable .osz cache ceiling in bytes (default 2 GiB, minimum 128 MiB)
beatmap_cache_max_bytes=2147483648

# cached Stable thumbnails, cover variants, and song previews (default 512 MiB)
beatmap_media_cache_max_bytes=536870912

# Discord webhook for score submissions (fire-and-forget, never blocks)
score_webhook=

# private Cloudflare R2 bucket used for custom profile pictures
avatar_r2_endpoint=https://23309d0f8407c82c3bd8406673bf3bec.r2.cloudflarestorage.com
avatar_r2_bucket=avatar
avatar_r2_access_key_id=
avatar_r2_secret_access_key=
