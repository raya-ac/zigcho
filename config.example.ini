# zigcho runs behind a TLS reverse proxy. Point c.*, osu.*, b.*, a.* at it.
bind=127.0.0.1
port=8080
database=zigcho.db
domain=osu.local
beatmap_mirror=https://catboy.best/d
registration=true

# osu API v1 key for beatmap metadata
# get one at https://osu.ppy.sh/p/api
osu_api_key=

# replaceable .osz cache ceiling in bytes (default 2 GiB, minimum 128 MiB)
beatmap_cache_max_bytes=2147483648

# Discord webhook for score submissions (fire-and-forget, never blocks)
score_webhook=
