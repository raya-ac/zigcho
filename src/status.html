<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#09090a">
  <title>kai</title>
  <style>
    :root{--bg:#09090a;--surface:#111113;--text:#ece8e6;--muted:#928b89;--line:#292427;--pink:#ed83b6;--pink-soft:#4a2939;--good:#8fd4b1}
    *{box-sizing:border-box}html{background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}body{margin:0;min-height:100svh}a{color:inherit;text-decoration:none}button{font:inherit}
    .shell{width:min(980px,calc(100% - 32px));margin:auto;min-height:100svh;display:flex;flex-direction:column}
    header{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{font:650 22px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.04em}.brand i{font-style:normal;color:var(--pink)}nav{display:flex;gap:24px;color:var(--muted);font-size:12px}nav a:hover,nav a.active{color:var(--text)}
    main{flex:1;padding:64px 0 72px}.eyebrow{color:var(--pink);font-size:10px;text-transform:uppercase;letter-spacing:.14em}.intro{display:flex;justify-content:space-between;align-items:end;gap:40px;padding-bottom:34px;border-bottom:1px solid var(--line)}
    h1{font:620 clamp(34px,6vw,64px)/.98 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.055em;margin:10px 0 0;max-width:680px}h2{font:600 22px/1.15 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.035em;margin:0}p{color:var(--muted)}
    .live{display:flex;align-items:center;gap:7px;color:var(--good);font-size:11px;white-space:nowrap}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}.stat{padding:21px 0}.stat+.stat{border-left:1px solid var(--line);padding-left:22px}.label{color:var(--muted);font-size:10px}.value{margin-top:6px;font-size:20px}
    .section{padding:42px 0;border-bottom:1px solid var(--line)}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}.text-link{color:var(--pink);font-size:11px}
    .rows{border-top:1px solid var(--line)}.row{min-height:58px;display:grid;grid-template-columns:52px minmax(180px,1fr) repeat(3,minmax(85px,auto));align-items:center;gap:18px;border-bottom:1px solid var(--line);transition:background .15s ease,padding .15s ease}.row:hover{background:var(--surface);padding:0 10px}.rank{color:var(--muted)}.player{display:flex;align-items:center;gap:12px;min-width:0}.avatar{width:32px;height:32px;object-fit:cover;border-radius:4px;background:var(--surface)}.name{font:560 14px ui-sans-serif,system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.country,.metric small{color:var(--muted);font-size:10px}.metric{text-align:right}.metric strong{display:block;font-weight:500}
    .filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 10px;cursor:pointer}.filter:hover,.filter.active{border-color:var(--pink-soft);background:var(--pink-soft);color:var(--text)}
    .profile-head{display:grid;grid-template-columns:112px 1fr;gap:28px;align-items:end;padding-bottom:30px;border-bottom:1px solid var(--line)}.profile-avatar{width:112px;height:112px;object-fit:cover;border-radius:7px}.profile-name{font:620 clamp(36px,7vw,68px)/.9 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.06em}.meta{margin-top:12px;color:var(--muted);font-size:11px}.role{color:var(--pink)}
    .profile-stats{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}.profile-stats .stat{min-width:0}.profile-stats .stat+.stat{border-left:1px solid var(--line);padding-left:16px}.profile-stats .value{font-size:17px;overflow:hidden;text-overflow:ellipsis}
    .score{display:grid;grid-template-columns:minmax(220px,1fr) repeat(4,minmax(70px,auto));gap:18px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.map-title{font:550 13px ui-sans-serif,system-ui,sans-serif}.diff{color:var(--muted);font-size:11px;margin-top:2px}
    .map-head{padding-bottom:28px;border-bottom:1px solid var(--line)}.map-title-big{font:620 clamp(34px,6vw,60px)/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.05em;margin:8px 0}.map-artist{color:var(--muted);font-size:16px}.map-meta{margin-top:18px;color:var(--muted)}.download{display:inline-block;margin-top:20px;padding:9px 13px;background:var(--pink);color:#180d13;font-weight:700}
    .difficulty{display:grid;grid-template-columns:minmax(180px,1fr) repeat(5,minmax(60px,auto));gap:18px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}.status{color:var(--pink)}
    .water{position:relative;height:70px;margin-top:34px;overflow:hidden;border-bottom:1px dashed var(--line)}.boat-run{position:absolute;left:-58px;bottom:8px;width:50px;height:38px;animation:sail 18s linear infinite}.boat{position:relative;width:50px;height:38px;animation:bob 2.4s ease-in-out infinite}.mast{position:absolute;left:27px;top:1px;width:1px;height:22px;background:var(--muted)}.sail{position:absolute;left:12px;top:3px;width:14px;height:17px;border-right:1px solid var(--pink);border-bottom:1px solid var(--pink);transform:skewY(-24deg)}.hull{position:absolute;left:4px;top:25px;width:43px;height:8px;border-top:1px solid var(--text);border-radius:0 0 60% 50%}.wake{position:absolute;right:43px;top:33px;width:28px;border-top:1px dashed var(--pink);opacity:.55}
    .empty{padding:48px 0;color:var(--muted);border-bottom:1px solid var(--line)}.error{color:#e99090}footer{height:58px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px;border-top:1px solid var(--line)}
    .reveal{animation:reveal .28s ease both}@keyframes reveal{from{opacity:0;transform:translateY(8px)}}@keyframes sail{to{transform:translateX(1038px)}}@keyframes bob{50%{transform:translateY(-3px) rotate(1deg)}}
    @media(max-width:760px){main{padding-top:38px}.intro{align-items:start;flex-direction:column;gap:18px}.stats{grid-template-columns:repeat(2,1fr)}.stat+.stat{border-left:0;padding-left:0}.stat:nth-child(even){border-left:1px solid var(--line);padding-left:16px}.row{grid-template-columns:40px minmax(150px,1fr) auto}.row .metric:nth-last-child(-n+2){display:none}.profile-stats{grid-template-columns:repeat(2,1fr)}.score{grid-template-columns:1fr auto}.score .metric:not(:last-child){display:none}.difficulty{grid-template-columns:1fr repeat(2,auto)}.difficulty .metric:nth-last-child(n+4){display:none}}
    @media(max-width:480px){nav{gap:14px}.profile-head{grid-template-columns:76px 1fr;gap:18px}.profile-avatar{width:76px;height:76px}.row{gap:10px}}
    @media(prefers-reduced-motion:reduce){.reveal,.boat-run,.boat{animation:none}.boat-run{left:45%}.row{transition:none}}
  </style>
</head>
<body>
  <div class="shell">
    <header><a class="brand" href="/">kai<i>.</i></a><nav><a href="/" data-nav="home">home</a><a href="/rankings" data-nav="rankings">rankings</a></nav></header>
    <main id="app" aria-live="polite"><div class="empty">loading</div></main>
    <footer><span id="host">kai.ovh</span><span>debug alpha / bancho protocol 19</span></footer>
  </div>
  <script>
    const app=document.getElementById('app'),fmt=n=>Number(n||0).toLocaleString(),pct=n=>(Number(n||0)*100).toFixed(2)+'%';
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const get=async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status===404?'not found':'not answering');return r.json()};
    const role=p=>p&(1<<14)?'developer':p&(1<<13)?'admin':p&(1<<12)?'moderator':p&(1<<11)?'beatmap nominator':p&(1<<4)?'supporter':'player';
    const statusName=s=>({pending:'pending',ranked:'ranked',approved:'approved',qualified:'qualified',loved:'loved'})[s]||s||'unknown';
    function active(name){document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===name))}
    function playerRows(players,limit=100){if(!players.length)return '<div class="empty">nobody has a score here yet</div>';return '<div class="rows">'+players.slice(0,limit).map(p=>`<a class="row" href="/u/${p.id}"><span class="rank">#${fmt(p.rank)}</span><span class="player"><img class="avatar" src="https://a.kai.ovh/${p.id}" alt=""><span><span class="name">${esc(p.name)}</span><span class="country">${esc(p.country)} · ${esc(role(p.privileges))}</span></span></span><span class="metric"><strong>${fmt(p.pp)}pp</strong><small>${pct(p.accuracy)}</small></span><span class="metric"><strong>${fmt(p.plays)}</strong><small>plays</small></span><span class="metric"><strong>${fmt(p.ranked_score)}</strong><small>ranked score</small></span></a>`).join('')+'</div>'}
    async function home(){active('home');const [s,r]=await Promise.all([get('/api/v1/status'),get('/api/v1/rankings?mode=0')]);app.innerHTML=`<div class="reveal"><section class="intro"><div><span class="eyebrow">stable first</span><h1>the server is alive.<br>the rest is getting there.</h1></div><span class="live"><i class="dot"></i>live</span></section><section class="stats">${[['online',s.online],['accounts',s.users],['plays',s.plays],['passed',s.passed],['maps',s.maps]].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${fmt(x[1])}</div></div>`).join('')}</section><section class="section"><div class="section-head"><h2>top players</h2><a class="text-link" href="/rankings">all rankings →</a></div>${playerRows(r.players,5)}</section><div class="water" aria-label="a small boat moving across the page"><div class="boat-run" aria-hidden="true"><div class="boat"><i class="mast"></i><i class="sail"></i><i class="hull"></i><i class="wake"></i></div></div></div></div>`}
    async function rankings(){active('rankings');const params=new URLSearchParams(location.search),mode=Number(params.get('mode')||0),data=await get('/api/v1/rankings?mode='+mode);const tabs=[[0,'vanilla'],[4,'relax'],[8,'autopilot']];app.innerHTML=`<div class="reveal"><section class="intro"><div><span class="eyebrow">standard</span><h1>rankings</h1></div><div class="filters">${tabs.map(t=>`<button class="filter ${mode===t[0]?'active':''}" data-mode="${t[0]}">${t[1]}</button>`).join('')}</div></section><section class="section">${playerRows(data.players)}</section></div>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>location.href='/rankings?mode='+b.dataset.mode)}
    async function profile(id){active('');const p=await get('/api/v1/users/'+id),stats=p.stats.find(s=>s.mode===0)||p.stats[0]||{};app.innerHTML=`<div class="reveal"><section class="profile-head"><img class="profile-avatar" src="https://a.kai.ovh/${p.id}" alt=""><div><div class="profile-name">${esc(p.name)}</div><div class="meta">${esc(p.country)} · <span class="role">${esc(role(p.privileges))}</span> · joined ${new Date(p.created_at*1000).toLocaleDateString()}</div></div></section><section class="profile-stats">${[['global rank','#'+fmt(stats.global_rank)],['performance',fmt(stats.pp)+'pp'],['accuracy',pct(stats.accuracy)],['playcount',fmt(stats.plays)],['ranked score',fmt(stats.ranked_score)],['max combo',fmt(stats.max_combo)+'x']].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</section><section class="section"><div class="section-head"><h2>recent plays</h2><span class="eyebrow">last 20</span></div>${p.scores.length?'<div>'+p.scores.map(s=>`<a class="score" href="/beatmapsets/${s.set_id}"><span><span class="map-title">${esc(s.artist)} — ${esc(s.title)}</span><span class="diff">[${esc(s.version)}] · ${esc(s.namespace)}${s.passed?'':' · failed'}</span></span><span class="metric"><strong>${fmt(s.score)}</strong><small>score</small></span><span class="metric"><strong>${Number(s.pp).toFixed(2)}pp</strong><small>performance</small></span><span class="metric"><strong>${pct(s.accuracy)}</strong><small>accuracy</small></span><span class="metric"><strong>${fmt(s.max_combo)}x</strong><small>combo</small></span></a>`).join('')+'</div>':'<div class="empty">no plays yet</div>'}</section></div>`}
    async function beatmap(setId){active('');const b=await get('/api/v1/beatmapsets/'+setId);app.innerHTML=`<div class="reveal"><section class="map-head"><span class="eyebrow">${esc(statusName(b.status))}</span><h1 class="map-title-big">${esc(b.title)}</h1><div class="map-artist">${esc(b.artist)} · mapped by ${esc(b.creator)}</div><div class="map-meta">${fmt(b.play_count)} plays · ${Number(b.bpm).toFixed(0)} bpm · set ${fmt(b.id)}</div>${b.availability.download_disabled?'':'<a class="download" href="/d/'+b.id+'">download .osz</a>'}</section><section class="section"><div class="section-head"><h2>difficulties</h2><span class="eyebrow">${b.beatmaps.length} maps</span></div><div>${b.beatmaps.map(m=>`<div class="difficulty"><span><span class="map-title">${esc(m.version)}</span><span class="diff"><span class="status">${esc(statusName(m.status))}</span> · ${['osu!','taiko','catch','mania'][m.mode_int]||'mode '+m.mode_int}</span></span><span class="metric"><strong>${Number(m.difficulty_rating).toFixed(2)}★</strong><small>stars</small></span><span class="metric"><strong>${Number(m.bpm).toFixed(0)}</strong><small>bpm</small></span><span class="metric"><strong>${Number(m.cs).toFixed(1)}</strong><small>cs</small></span><span class="metric"><strong>${Number(m.ar).toFixed(1)}</strong><small>ar</small></span><span class="metric"><strong>${fmt(m.max_combo)}x</strong><small>combo</small></span></div>`).join('')}</div></section></div>`}
    async function route(){try{const p=location.pathname;if(p==='/')return home();if(p==='/rankings')return rankings();if(/^\/u\/\d+$/.test(p))return profile(p.split('/')[2]);if(/^\/beatmapsets\/\d+$/.test(p))return beatmap(p.split('/')[2]);throw new Error('not found')}catch(e){app.innerHTML=`<div class="empty error">${esc(e.message)}</div>`}}
    document.getElementById('host').textContent=location.hostname;route();
  </script>
</body>
</html>
