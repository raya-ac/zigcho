name: stable conformance contracts

on:
  pull_request:
    paths:
      - src/**
      - .github/workflows/stable-conformance.yml
  push:
    branches:
      - main
    paths:
      - src/**
      - .github/workflows/stable-conformance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    uses: zigcho/stable-conformance/.github/workflows/check.yml@main
    with:
      zigcho_ref: ${{ github.sha }}
